<!DOCTYPE html>
<html lang="zh" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>空月平台 · 注册</title>
<script>(function(){try{var t=localStorage.getItem('kongyue_theme')||'dark';document.documentElement.setAttribute('data-theme',t)}catch(e){}})()</script>
<style>
:root{
  --bg1:#0b0f1a;--bg2:#141b2b;
  --card:rgba(18,25,40,.75);--card-solid:#121a28;--border:rgba(255,255,255,.06);
  --t:#eef4ff;--t2:#8fa3c9;--t3:#7f93b8;
  --input:rgba(8,14,24,.7);--input-bd:#253248;
  --accent:#5b8cff;--accent2:#3b66b0;
  --pos:#6ee7a0;--neg:#ff8a9a;
  --pos-bg:rgba(60,200,120,.1);--pos-bd:rgba(80,220,140,.25);
  --neg-bg:rgba(255,80,100,.1);--neg-bd:rgba(255,100,120,.25);
  --info-bg:rgba(91,140,255,.08);--info-bd:rgba(91,140,255,.25);
  --shadow:0 20px 50px -15px rgba(0,0,0,.8);
  --glow:rgba(80,140,255,.25);
  --ease:cubic-bezier(.16,1,.3,1);
}
[data-theme="light"]{
  --bg1:#eef2f9;--bg2:#dbe4f2;
  --card:rgba(255,255,255,.82);--card-solid:#ffffff;--border:rgba(15,30,60,.08);
  --t:#17253d;--t2:#5a6b85;--t3:#7a8aa3;
  --input:rgba(240,244,250,.9);--input-bd:#cbd6e6;
  --accent:#3b66b0;--accent2:#2a4d8f;
  --pos:#199f4f;--neg:#d92b3a;
  --pos-bg:rgba(25,159,79,.1);--pos-bd:rgba(25,159,79,.22);
  --neg-bg:rgba(217,43,58,.08);--neg-bd:rgba(217,43,58,.22);
  --info-bg:rgba(59,102,176,.08);--info-bd:rgba(59,102,176,.22);
  --shadow:0 20px 50px -15px rgba(50,80,140,.25);
  --glow:rgba(90,140,220,.2);
}
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif;-webkit-tap-highlight-color:transparent}
body{background:linear-gradient(145deg,var(--bg1) 0%,var(--bg2) 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.2rem;color:var(--t);
  opacity:0;transform:translateY(6px);
  transition:opacity .45s var(--ease),transform .45s var(--ease),background .5s var(--ease),color .3s var(--ease)}
body.page-loaded{opacity:1;transform:translateY(0)}
body.page-leaving{opacity:0;transform:translateY(-6px) scale(.99)}
body::before{content:'';position:fixed;top:-30%;left:-20%;width:70%;height:70%;background:radial-gradient(circle,var(--glow) 0%,transparent 65%);filter:blur(80px);pointer-events:none;z-index:0;opacity:.7;animation:floatA 22s ease-in-out infinite}
@keyframes floatA{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(60px,-40px) scale(1.12)}}
.card{position:relative;z-index:1;background:var(--card);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-radius:32px;box-shadow:var(--shadow),inset 0 1px 2px rgba(255,255,255,.06);width:100%;max-width:400px;padding:2rem 1.8rem 1.8rem;
  border:1px solid var(--border);transition:background .5s var(--ease),box-shadow .4s var(--ease),border-color .3s var(--ease);animation:cardIn .8s var(--ease) both}
@keyframes cardIn{from{opacity:0;transform:translateY(30px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.card:hover{box-shadow:0 28px 60px -15px rgba(0,0,0,.5),0 0 0 1px rgba(120,160,255,.15),inset 0 1px 2px rgba(255,255,255,.06)}
.theme-btn{position:absolute;top:1rem;right:1rem;width:38px;height:38px;border-radius:50%;background:var(--input);border:1px solid var(--border);color:var(--t2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .35s var(--ease)}
.theme-btn:hover{color:var(--accent);border-color:var(--accent);transform:rotate(20deg) scale(1.08)}
.theme-btn svg{width:16px;height:16px}
[data-theme="dark"] .i-sun{display:block}[data-theme="dark"] .i-moon{display:none}
[data-theme="light"] .i-sun{display:none}[data-theme="light"] .i-moon{display:block}
h1{font-size:1.9rem;font-weight:600;letter-spacing:-.02em;color:var(--t);margin-bottom:.15rem;text-shadow:0 4px 20px var(--glow);text-align:center;animation:upIn .8s .1s var(--ease) both}
h1 span{font-size:1.3rem;opacity:.6;font-weight:300}
.sub{color:var(--t2);font-size:.85rem;margin-bottom:1.6rem;letter-spacing:.3px;text-transform:uppercase;text-align:center;animation:upIn .8s .15s var(--ease) both}
@keyframes upIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
.field{margin-bottom:1rem;animation:upIn .8s var(--ease) both}
.field:nth-of-type(1){animation-delay:.2s}.field:nth-of-type(2){animation-delay:.25s}.field:nth-of-type(3){animation-delay:.3s}
label{display:block;font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--t2);margin-bottom:.35rem}
.wrap{display:flex;align-items:center;background:var(--input);border-radius:30px;padding:0 1.1rem;border:1px solid var(--input-bd);transition:all .3s var(--ease);box-shadow:inset 0 3px 8px rgba(0,0,0,.15)}
.wrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--info-bg),inset 0 3px 8px rgba(0,0,0,.15);transform:translateY(-1px)}
.wrap .icon{font-size:1rem;margin-right:.6rem;opacity:.6;color:var(--accent);user-select:none}
input{width:100%;border:none;padding:.75rem 0;font-size:.9rem;background:transparent;outline:none;color:var(--t);font-family:inherit}
input::placeholder{color:var(--t3);font-size:.85rem}
.hint{font-size:.68rem;color:var(--t3);margin-top:.4rem;padding-left:.3rem;letter-spacing:.3px}
.btn{position:relative;width:100%;border:none;background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;font-weight:600;font-size:.95rem;padding:.9rem;border-radius:40px;cursor:pointer;transition:all .35s var(--ease);margin-top:.8rem;letter-spacing:1.2px;text-transform:uppercase;box-shadow:0 8px 20px -6px rgba(59,102,176,.5),inset 0 0 0 1px rgba(255,255,255,.15);overflow:hidden;font-family:inherit;animation:upIn .8s .35s var(--ease) both}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 28px -8px rgba(59,102,176,.7)}
.btn:active{transform:translateY(0) scale(.98)}
.btn::after{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(120deg,transparent,rgba(255,255,255,.3),transparent);transform:skewX(-20deg);transition:left .7s var(--ease)}
.btn:hover::after{left:120%}
.msg{margin:1.1rem 0 .3rem;padding:.7rem 1rem;border-radius:30px;font-size:.8rem;font-weight:500;text-align:center;background:rgba(255,255,255,.03);color:var(--t2);min-height:2.8rem;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);transition:all .3s var(--ease);animation:upIn .8s .4s var(--ease) both}
.msg.info{background:var(--info-bg);border-color:var(--info-bd);color:var(--accent)}
.msg.error{background:var(--neg-bg);border-color:var(--neg-bd);color:var(--neg)}
.msg.success{background:var(--pos-bg);border-color:var(--pos-bd);color:var(--pos)}
.switch{text-align:center;font-size:.78rem;color:var(--t2);margin-top:1.1rem;animation:upIn .8s .45s var(--ease) both}
.switch a{color:var(--accent);text-decoration:none;font-weight:600;margin-left:.3rem;transition:all .25s var(--ease);display:inline-block}
.switch a:hover{transform:translateX(3px)}
@media(max-width:420px){.card{padding:1.6rem 1.3rem 1.4rem;border-radius:24px}h1{font-size:1.6rem}}
</style>
</head>
<body>
<div class="card">
  <button class="theme-btn" onclick="toggleTheme()" aria-label="切换主题">
    <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
    <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  </button>
  <h1>空月 <span>·</span> 平台</h1>
  <div class="sub">注册账号</div>
  <form id="regForm" autocomplete="off" onsubmit="return false">
    <div class="field">
      <label for="regUser">用户名</label>
      <div class="wrap">
        <span class="icon">&#9993;</span>
        <input type="text" id="regUser" placeholder="3-20 位字母 / 数字 / 下划线" maxlength="20">
      </div>
      <div class="hint">登录时使用，注册后不可修改</div>
    </div>
    <div class="field">
      <label for="regPass">密码</label>
      <div class="wrap">
        <span class="icon">&#128274;</span>
        <input type="password" id="regPass" placeholder="至少 4 位" maxlength="32">
      </div>
    </div>
    <div class="field">
      <label for="regPass2">确认密码</label>
      <div class="wrap">
        <span class="icon">&#128274;</span>
        <input type="password" id="regPass2" placeholder="请再次输入密码" maxlength="32">
      </div>
    </div>
    <button type="submit" class="btn" id="regBtn">注册并登录</button>
  </form>
  <div id="messageBox" class="msg info">注册即赠送 10,000 USDT</div>
  <div class="switch">已有账号？<a href="index.html">返回登录 →</a></div>
</div>
<script>
window.toggleTheme=function(){var c=document.documentElement.getAttribute('data-theme');var n=c==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);try{localStorage.setItem('kongyue_theme',n)}catch(e){}};
document.addEventListener('DOMContentLoaded',function(){document.body.classList.add('page-loaded')});
document.addEventListener('click',function(e){var a=e.target.closest('a[href$=".html"]');if(!a||a.target==='_blank')return;e.preventDefault();document.body.classList.add('page-leaving');setTimeout(function(){window.location.href=a.href},220)});
(function(){
"use strict";
var UK='kongyue_users_v1',SK='kongyue_session_v1';
var IP=[
{id:'p1',name:'虚拟货币量化搬砖',industry:'量化搬砖',riskLevel:'mid',rateMin:15,rateMax:32},
{id:'p2',name:'跨境电商刷单套利',industry:'电商刷单',riskLevel:'low',rateMin:8,rateMax:18},
{id:'p3',name:'海外博彩代理',industry:'博彩代理',riskLevel:'high',rateMin:25,rateMax:60},
{id:'p4',name:'DeFi 流动性挖矿',industry:'DeFi挖矿',riskLevel:'mid',rateMin:15,rateMax:32},
{id:'p5',name:'AI 算力租赁',industry:'算力租赁',riskLevel:'low',rateMin:8,rateMax:18},
{id:'p6',name:'数字货币合约带单',industry:'合约带单',riskLevel:'high',rateMin:25,rateMax:60},
{id:'p7',name:'游戏点卡代充',industry:'点卡代充',riskLevel:'mid',rateMin:15,rateMax:32},
{id:'p8',name:'海外广告联盟',industry:'广告联盟',riskLevel:'low',rateMin:8,rateMax:18}];
var RC={low:{label:'低风险'},mid:{label:'中风险'},high:{label:'高风险'}};
function LU(){try{var r=localStorage.getItem(UK);return r?JSON.parse(r):{}}catch(e){return{}}}
function SU(u){try{localStorage.setItem(UK,JSON.stringify(u))}catch(e){}}
function SS(u){try{localStorage.setItem(SK,u)}catch(e){}}
function BU(un,pw){
  var ps=IP.map(function(p){var c=RC[p.riskLevel];return{id:p.id,name:p.name,industry:p.industry,riskLevel:p.riskLevel,riskLabel:c.label,rateMin:p.rateMin,rateMax:p.rateMax,currentRate:Math.round((p.rateMin+Math.random()*(p.rateMax-p.rateMin))*10)/10,invested:0,profit:0,settleCount:0,lastUpdate:Date.now()}});
  return{username:un,password:pw,nickname:un,avatar:'img/avatar.png',balance:10000,createdAt:Date.now(),projects:ps,records:[],stats:{totalProfit:0,totalLoss:0,settleCount:0},lastSettleAt:Date.now(),lastRiskAdjustAt:Date.now(),version:1};
}
var f=document.getElementById('regForm'),u=document.getElementById('regUser'),p=document.getElementById('regPass'),p2=document.getElementById('regPass2'),m=document.getElementById('messageBox');
function SM(t,type){m.textContent=t;m.className='msg'+(type?' '+type:'')}
f.addEventListener('submit',function(e){
  e.preventDefault();
  var uu=u.value.trim(),pp=p.value,pp2=p2.value;
  if(!uu){SM('请输入用户名','error');u.focus();return}
  if(!/^[A-Za-z0-9_]{3,20}$/.test(uu)){SM('用户名需 3-20 位字母/数字/下划线','error');u.focus();return}
  if(!pp||pp.length<4){SM('密码至少 4 位','error');p.focus();return}
  if(pp!==pp2){SM('两次输入的密码不一致','error');p2.focus();return}
  var users=LU();
  if(users[uu]){SM('该用户名已被注册','error');u.focus();return}
  users[uu]=BU(uu,pp);SU(users);SS(uu);
  SM('注册成功，正在进入…','success');
  document.body.classList.add('page-leaving');
  setTimeout(function(){window.location.href='home.html'},450);
});
})();
</script>
</body>
</html>
