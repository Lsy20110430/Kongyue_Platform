<!-- ============================================================
     文件：privacy.html（账户设置）
     ============================================================ -->
<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>空月平台 · 账户设置</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif; }
    body { background: linear-gradient(145deg,#0b0f1a 0%,#141b2b 100%); min-height:100vh; color:#eef4ff; padding-bottom:2.5rem; }
    .navbar {
      position: sticky; top:0; z-index:100;
      background: rgba(18,25,40,.88); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255,255,255,.06); padding: .85rem 1.1rem;
      display:flex; align-items:center; justify-content:space-between; gap:1rem;
      box-shadow: 0 8px 24px -12px rgba(0,0,0,.8);
    }
    .nav-brand { font-size:1.05rem; font-weight:600; letter-spacing:.02em; color:#eef4ff; text-shadow:0 2px 12px rgba(80,140,255,.25); white-space:nowrap; }
    .nav-brand span { color:#5b8cff; font-weight:300; }
    .nav-links { display:flex; gap:.25rem; }
    .nav-link {
      text-decoration:none; color:#8fa3c9; font-size:.82rem; font-weight:500;
      padding:.45rem .9rem; border-radius:20px; transition:.22s; letter-spacing:.3px; white-space:nowrap;
    }
    .nav-link:hover { color:#c8d6f0; background:rgba(255,255,255,.05); }
    .nav-link.active { color:#e3ecff; background:linear-gradient(135deg,#2a4270,#1b2d4e);
      box-shadow: 0 4px 12px -4px rgba(0,0,0,.7), inset 0 0 0 1px rgba(120,160,255,.2); }

    .container { max-width:560px; margin:0 auto; padding:1.4rem 1.1rem 0; }
    .back-link {
      display:inline-flex; align-items:center; gap:.35rem;
      font-size:.78rem; color:#8fa3c9; text-decoration:none;
      margin-bottom:1rem; transition:.2s; letter-spacing:.3px;
    }
    .back-link:hover { color:#c8d6f0; }
    .page-title { font-size:1.35rem; font-weight:600; letter-spacing:-.01em; margin-bottom:.25rem; }
    .page-sub { font-size:.75rem; color:#7f93b8; margin-bottom:1.35rem; letter-spacing:.3px; }

    .form-card {
      background: rgba(18,25,40,.78); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-radius:26px; padding:1.5rem 1.35rem 1.4rem;
      border:1px solid rgba(255,255,255,.07);
      box-shadow: 0 20px 44px -20px rgba(0,0,0,.95), inset 0 1px 2px rgba(255,255,255,.05);
    }
    .field { margin-bottom:1.15rem; }
    .field label {
      display:block; font-size:.68rem; font-weight:600; text-transform:uppercase;
      letter-spacing:1.1px; color:#9db1d4; margin-bottom:.45rem;
    }
    .field input {
      width:100%; background:rgba(8,14,24,.7); border:1px solid #253248;
      border-radius:30px; padding:.78rem 1.15rem; color:#eef4ff; font-size:.9rem;
      outline:none; transition:.25s; box-shadow: inset 0 3px 8px rgba(0,0,0,.5); font-family:inherit;
    }
    .field input:focus { border-color:#5b8cff; box-shadow: 0 0 0 3px rgba(91,140,255,.15), inset 0 3px 8px rgba(0,0,0,.5); }
    .field input::placeholder { color:#475d82; }
    .field input:disabled { opacity:.6; cursor:not-allowed; }
    .field .hint { font-size:.68rem; color:#6b7fa3; margin-top:.45rem; padding-left:.3rem; letter-spacing:.3px; }

    .btn-row { display:flex; gap:.65rem; margin-top:1.4rem; }
    .btn {
      flex:1; border:none; padding:.8rem; border-radius:40px; font-weight:600; font-size:.88rem;
      cursor:pointer; transition:.25s; letter-spacing:1px; text-transform:uppercase; font-family:inherit;
    }
    .btn-primary {
      background:linear-gradient(135deg,#1e2e4a,#15223a); color:#e3ecff;
      box-shadow: 0 8px 20px -6px rgba(0,0,0,.6), inset 0 0 0 1px rgba(120,160,255,.15);
      border:1px solid rgba(120,160,255,.1);
    }
    .btn-primary:hover { background:linear-gradient(135deg,#253c5e,#1a2a44); transform:scale(1.02); }
    .btn-primary:active { transform:scale(.97); }
    .btn-ghost {
      background:rgba(255,255,255,.04); color:#8fa3c9;
      border:1px solid rgba(255,255,255,.07); flex:0 0 38%;
    }
    .btn-ghost:hover { background:rgba(255,255,255,.08); color:#b8c9e8; }

    .danger-zone { margin-top:1.5rem; padding-top:1.2rem; border-top:1px dashed rgba(255,80,100,.2); }
    .danger-title {
      font-size:.72rem; color:#ff9aa9; letter-spacing:.5px; margin-bottom:.7rem;
      text-transform:uppercase; font-weight:600;
    }
    .danger-desc { font-size:.7rem; color:#7f93b8; line-height:1.6; margin-bottom:.85rem; letter-spacing:.2px; }
    .btn-danger {
      width:100%; background:rgba(255,80,100,.08); color:#ff9aa9;
      border:1px solid rgba(255,100,120,.25);
      padding:.75rem; border-radius:40px; font-weight:600; font-size:.82rem;
      cursor:pointer; transition:.25s; letter-spacing:.6px; font-family:inherit;
    }
    .btn-danger:hover { background:rgba(255,80,100,.14); }

    /* ========= 自定义弹窗通用 ========= */
    .modal-overlay {
      position:fixed; inset:0; background:rgba(0,0,0,.72); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
      display:flex; align-items:center; justify-content:center; z-index:900;
      animation:fadeIn .18s ease; padding:1.2rem;
    }
    @keyframes fadeIn { from{opacity:0} to{opacity:1} }
    .modal {
      background:rgba(18,26,42,.96); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
      border-radius:24px; padding:1.5rem 1.4rem 1.3rem; max-width:340px; width:100%;
      box-shadow: 0 40px 80px -20px rgba(0,0,0,.9), 0 0 0 1px rgba(120,160,255,.1);
      border:1px solid rgba(255,255,255,.05);
      animation: slideUp .25s cubic-bezier(.16,1,.3,1);
    }
    @keyframes slideUp { from{transform:translateY(20px);opacity:0} to{transform:translateY(0);opacity:1} }
    .modal h3 { font-size:1.05rem; color:#eef4ff; margin-bottom:.5rem; font-weight:600; letter-spacing:-.01em; }
    .modal .modal-desc { font-size:.8rem; color:#8fa3c9; line-height:1.6; margin-bottom:1.1rem; letter-spacing:.2px; }
    .modal-actions { display:flex; gap:.6rem; margin-top:.8rem; }
    .modal-actions button {
      flex:1; border:none; padding:.7rem; border-radius:30px; font-weight:600; font-size:.85rem;
      cursor:pointer; transition:.2s; letter-spacing:.6px; font-family:inherit;
    }
    .modal-btn-primary {
      background:linear-gradient(135deg,#2a4270,#1b2d4e); color:#e3ecff;
      box-shadow: 0 6px 14px -4px rgba(0,0,0,.6), inset 0 0 0 1px rgba(120,160,255,.15);
    }
    .modal-btn-primary:hover { background:linear-gradient(135deg,#345288,#223a5e); transform:scale(1.02); }
    .modal-btn-ghost { background:rgba(255,255,255,.04); color:#8fa3c9; border:1px solid rgba(255,255,255,.07); }
    .modal-btn-ghost:hover { background:rgba(255,255,255,.08); color:#b8c9e8; }
    .modal-btn-danger {
      background:rgba(255,80,100,.1); color:#ff9aa9; border:1px solid rgba(255,100,120,.28);
    }
    .modal-btn-danger:hover { background:rgba(255,80,100,.16); }

    /* Toast */
    .toast {
      position:fixed; left:50%; bottom:2rem; transform:translate(-50%,20px);
      background:rgba(18,26,42,.96); color:#8ce0ac;
      border:1px solid rgba(80,220,140,.3);
      padding:.7rem 1.4rem; border-radius:30px; font-size:.82rem; font-weight:500;
      box-shadow: 0 16px 40px -12px rgba(0,0,0,.9);
      opacity:0; pointer-events:none; transition:.3s; z-index:500; letter-spacing:.3px;
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    }
    .toast.show { opacity:1; transform:translate(-50%,0); }

    @media (max-width:400px) {
      .nav-link { padding:.4rem .7rem; font-size:.76rem; }
      .page-title { font-size:1.2rem; }
      .form-card { padding:1.25rem 1.1rem 1.2rem; }
    }
  </style>
</head>
<body>

<nav class="navbar">
  <div class="nav-brand">空月 <span>·</span> 平台</div>
  <div class="nav-links">
    <a href="home.html" class="nav-link">主页</a>
    <a href="records.html" class="nav-link">记录</a>
    <a href="profile.html" class="nav-link">个人</a>
  </div>
</nav>

<div class="container">
  <a class="back-link" href="profile.html">‹ 返回个人中心</a>

  <div class="page-title">账户设置</div>
  <div class="page-sub">修改账号昵称与登录密码</div>

  <div class="form-card">
    <div class="field">
      <label for="nickInput">账号昵称</label>
      <input type="text" id="nickInput" placeholder="请输入新的昵称" maxlength="20" />
      <div class="hint">最长 20 个字符，将显示在个人中心</div>
    </div>

    <div class="field">
      <label>用户名</label>
      <input type="text" id="unameInput" disabled />
      <div class="hint">用户名注册后不可修改</div>
    </div>

    <div class="btn-row">
      <button type="button" class="btn btn-ghost" id="resetBtn">重置</button>
      <button type="button" class="btn btn-primary" id="saveBtn">保存</button>
    </div>

    <div class="danger-zone">
      <div class="danger-title">注销账号</div>
      <div class="danger-desc">注销后该账号的所有数据将被永久删除，且无法恢复。</div>
      <button type="button" class="btn-danger" id="logoutBtn">注销当前账号</button>
    </div>
  </div>
</div>

<div id="modalRoot"></div>
<div id="toast" class="toast">已保存</div>

<script>
  (function () {
    "use strict";
    var USERS_KEY = 'kongyue_users_v1';
    var SESSION_KEY = 'kongyue_session_v1';

    function loadUsers() {
      try { var raw = localStorage.getItem(USERS_KEY); return raw ? JSON.parse(raw) : {}; }
      catch (e) { return {}; }
    }
    function saveUsers(u) {
      try { localStorage.setItem(USERS_KEY, JSON.stringify(u)); return true; }
      catch (e) { return false; }
    }
    function getSession() {
      try { return localStorage.getItem(SESSION_KEY) || null; } catch (e) { return null; }
    }
    function clearSession() {
      try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
    }
    function getCurrentUser() {
      var s = getSession(); if (!s) return null;
      var users = loadUsers(); return users[s] || null;
    }

    var currentUser = getCurrentUser();
    if (!currentUser) { window.location.href = 'index.html'; return; }

    var nickInput = document.getElementById('nickInput');
    var unameInput = document.getElementById('unameInput');
    var saveBtn = document.getElementById('saveBtn');
    var resetBtn = document.getElementById('resetBtn');
    var logoutBtn = document.getElementById('logoutBtn');
    var toastEl = document.getElementById('toast');
    var modalRoot = document.getElementById('modalRoot');

    function toast(msg) {
      toastEl.textContent = msg;
      toastEl.className = 'toast show';
      clearTimeout(toast._t);
      toast._t = setTimeout(function () { toastEl.className = 'toast'; }, 1800);
    }

    /* ========= 弹窗 ========= */
    function showAlert(opts) {
      var ov = document.createElement('div');
      ov.className = 'modal-overlay';
      ov.innerHTML =
        '<div class="modal">' +
          '<h3>' + (opts.title || '提示') + '</h3>' +
          (opts.desc ? '<div class="modal-desc">' + opts.desc + '</div>' : '') +
          '<div class="modal-actions">' +
            '<button class="modal-btn-primary" data-act="ok">' + (opts.confirmText || '确定') + '</button>' +
          '</div>' +
        '</div>';
      modalRoot.appendChild(ov);
      var okBtn = ov.querySelector('[data-act="ok"]');
      function close() { ov.remove(); if (opts.onConfirm) opts.onConfirm(); }
      okBtn.addEventListener('click', close);
      ov.addEventListener('click', function (e) { if (e.target === ov) close(); });
      setTimeout(function () { okBtn.focus(); }, 50);
    }

    function showConfirm(opts) {
      var ov = document.createElement('div');
      ov.className = 'modal-overlay';
      var btnClass = opts.type === 'danger' ? 'modal-btn-danger' : 'modal-btn-primary';
      ov.innerHTML =
        '<div class="modal">' +
          '<h3>' + (opts.title || '确认操作') + '</h3>' +
          (opts.desc ? '<div class="modal-desc">' + opts.desc + '</div>' : '') +
          '<div class="modal-actions">' +
            '<button class="modal-btn-ghost" data-act="cancel">' + (opts.cancelText || '取消') + '</button>' +
            '<button class="' + btnClass + '" data-act="ok">' + (opts.confirmText || '确定') + '</button>' +
          '</div>' +
        '</div>';
      modalRoot.appendChild(ov);
      function close() { ov.remove(); }
      ov.querySelector('[data-act="cancel"]').addEventListener('click', close);
      ov.querySelector('[data-act="ok"]').addEventListener('click', function () {
        close();
        if (opts.onConfirm) opts.onConfirm();
      });
      ov.addEventListener('click', function (e) { if (e.target === ov) close(); });
    }

    nickInput.value = currentUser.nickname || currentUser.username;
    unameInput.value = currentUser.username;

    saveBtn.addEventListener('click', function () {
      var u = getCurrentUser();
      if (!u) { window.location.href = 'index.html'; return; }

      var nick = nickInput.value.trim();
      if (!nick) { showAlert({ title: '保存失败', desc: '昵称不能为空' }); nickInput.focus(); return; }
      if (nick.length > 20) { showAlert({ title: '保存失败', desc: '昵称最长 20 个字符' }); nickInput.focus(); return; }

      u.nickname = nick;
      var users = loadUsers(); users[u.username] = u;
      if (!saveUsers(users)) { showAlert({ title: '保存失败', desc: '数据写入失败，请重试' }); return; }
      currentUser = u;
      toast('已保存');
      setTimeout(function () { window.location.href = 'profile.html'; }, 900);
    });

    resetBtn.addEventListener('click', function () {
      var u = getCurrentUser(); if (!u) return;
      nickInput.value = u.nickname || u.username;
      toast('已重置');
    });

    logoutBtn.addEventListener('click', function () {
      var u = getCurrentUser();
      if (!u) { window.location.href = 'index.html'; return; }

      showConfirm({
        title: '注销账号',
        desc: '确定要注销账号「<strong style="color:#eef4ff;">' + u.username + '</strong>」吗？<br /><br />该账号的所有数据将被<strong style="color:#ff9aa9;">永久删除</strong>，无法恢复。',
        type: 'danger',
        confirmText: '确认注销',
        onConfirm: function () {
          showConfirm({
            title: '再次确认',
            desc: '此操作不可撤销，是否继续？',
            type: 'danger',
            confirmText: '永久删除',
            onConfirm: function () {
              var users = loadUsers();
              delete users[u.username];
              saveUsers(users);
              clearSession();
              toast('已注销，正在退出…');
              setTimeout(function () { window.location.href = 'index.html'; }, 900);
            }
          });
        }
      });
    });
  })();
</script>
</body>
</html>
