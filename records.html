<!-- ============================================================
     文件：records.html（记录）
     ============================================================ -->
<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>空月平台 · 记录</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif; }
    body { background: linear-gradient(145deg,#0b0f1a 0%,#141b2b 100%); min-height:100vh; color:#eef4ff; padding-bottom:2.5rem; }
    .navbar {
      position: sticky; top:0; z-index:100;
      background: rgba(18,25,40,.88); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255,255,255,.06); padding: .85rem 1.1rem;
      display:flex; align-items:center; justify-content:space-between; gap:1rem;
      box-shadow: 0 8px 24px -12px rgba(0,0,0,.8);
    }
    .nav-brand { font-size:1.05rem; font-weight:600; letter-spacing:.02em; color:#eef4ff; text-shadow:0 2px 12px rgba(80,140,255,.25); white-space:nowrap; }
    .nav-brand span { color:#5b8cff; font-weight:300; }
    .nav-links { display:flex; gap:.25rem; }
    .nav-link {
      text-decoration:none; color:#8fa3c9; font-size:.82rem; font-weight:500;
      padding:.45rem .9rem; border-radius:20px; transition:.22s; letter-spacing:.3px; white-space:nowrap;
    }
    .nav-link:hover { color:#c8d6f0; background:rgba(255,255,255,.05); }
    .nav-link.active { color:#e3ecff; background:linear-gradient(135deg,#2a4270,#1b2d4e);
      box-shadow: 0 4px 12px -4px rgba(0,0,0,.7), inset 0 0 0 1px rgba(120,160,255,.2); }

    .container { max-width:560px; margin:0 auto; padding:1.2rem 1.1rem 0; }

    .stat-row { display:grid; grid-template-columns:1fr 1fr 1fr; gap:.6rem; margin-bottom:1.2rem; }
    .stat-box {
      background:rgba(18,25,40,.78); border:1px solid rgba(255,255,255,.06);
      border-radius:18px; padding:.75rem .7rem; text-align:center;
      box-shadow: 0 10px 24px -16px rgba(0,0,0,.9), inset 0 1px 2px rgba(255,255,255,.04);
    }
    .stat-label { font-size:.6rem; color:#7f93b8; letter-spacing:1px; text-transform:uppercase; margin-bottom:.3rem; }
    .stat-value { font-size:.95rem; font-weight:700; letter-spacing:.2px; }
    .stat-value.pos { color:#6ee7a0; }
    .stat-value.neg { color:#ff8a9a; }
    .stat-value.neu { color:#eef4ff; }

    .page-title { font-size:1.35rem; font-weight:600; letter-spacing:-.01em; margin-bottom:.25rem; }
    .page-sub { font-size:.75rem; color:#7f93b8; margin-bottom:1rem; letter-spacing:.3px; display:flex; align-items:center; justify-content:space-between; }
    .refresh-btn {
      background:rgba(255,255,255,.05); color:#8fa3c9; border:1px solid rgba(255,255,255,.08);
      padding:.28rem .7rem; border-radius:12px; font-size:.68rem; cursor:pointer;
      transition:.2s; font-family:inherit; letter-spacing:.3px;
    }
    .refresh-btn:hover { background:rgba(255,255,255,.09); color:#c8d6f0; }

    .list { display:flex; flex-direction:column; gap:.65rem; }
    .card-item {
      background: rgba(18,25,40,.72); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border-radius:18px; padding:.9rem 1.1rem;
      border:1px solid rgba(255,255,255,.06);
      box-shadow: 0 10px 26px -16px rgba(0,0,0,.9), inset 0 1px 2px rgba(255,255,255,.04);
      display:flex; align-items:center; justify-content:space-between; gap:1rem;
    }
    .item-main { flex:1; min-width:0; }
    .item-name { font-size:.88rem; font-weight:600; color:#eef4ff; letter-spacing:.2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .item-meta { font-size:.66rem; color:#7f93b8; margin-top:.28rem; letter-spacing:.3px; display:flex; gap:.65rem; }
    .item-meta .bal { color:#5d7298; }
    .item-value { font-size:.98rem; font-weight:700; letter-spacing:.2px; white-space:nowrap; }
    .pos { color:#6ee7a0; text-shadow:0 0 12px rgba(60,200,120,.25); }
    .neg { color:#ff8a9a; text-shadow:0 0 12px rgba(255,80,100,.2); }
    .empty {
      text-align:center; padding:2.5rem 1rem; color:#7f93b8; font-size:.85rem;
      background:rgba(18,25,40,.6); border-radius:20px; border:1px dashed rgba(255,255,255,.08);
    }
    @media (max-width:400px) {
      .nav-link { padding:.4rem .7rem; font-size:.76rem; }
      .page-title { font-size:1.2rem; }
    }
  </style>
</head>
<body>

<nav class="navbar">
  <div class="nav-brand">空月 <span>·</span> 平台</div>
  <div class="nav-links">
    <a href="home.html" class="nav-link">主页</a>
    <a href="records.html" class="nav-link active">记录</a>
    <a href="profile.html" class="nav-link">个人</a>
  </div>
</nav>

<div class="container">
  <div class="page-title">余额记录</div>
  <div class="page-sub">
    <span>账户余额增减明细</span>
    <button class="refresh-btn" id="refreshBtn">刷新</button>
  </div>

  <div class="stat-row">
    <div class="stat-box">
      <div class="stat-label">累计收益</div>
      <div class="stat-value pos" id="statProfit">+0.00</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">累计亏损</div>
      <div class="stat-value neg" id="statLoss">-0.00</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">净盈亏</div>
      <div class="stat-value neu" id="statNet">0.00</div>
    </div>
  </div>

  <div id="list" class="list">
    <div class="empty">正在加载记录…</div>
  </div>
</div>

<script>
  (function () {
    "use strict";
    var USERS_KEY = 'kongyue_users_v1';
    var SESSION_KEY = 'kongyue_session_v1';

    function loadUsers() {
      try { var raw = localStorage.getItem(USERS_KEY); return raw ? JSON.parse(raw) : {}; }
      catch (e) { return {}; }
    }
    function getSession() {
      try { return localStorage.getItem(SESSION_KEY) || null; } catch (e) { return null; }
    }
    function getCurrentUser() {
      var s = getSession(); if (!s) return null;
      var users = loadUsers(); return users[s] || null;
    }

    if (!getCurrentUser()) { window.location.href = 'index.html'; return; }

    function esc(s) {
      return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }
    function fmt(n, d) { return Number(n).toFixed(d === undefined ? 2 : d); }

    var listEl = document.getElementById('list');
    var statProfit = document.getElementById('statProfit');
    var statLoss = document.getElementById('statLoss');
    var statNet = document.getElementById('statNet');

    function render() {
      var user = getCurrentUser();
      if (!user) { window.location.href = 'index.html'; return; }

      var profit = user.stats.totalProfit || 0;
      var loss = user.stats.totalLoss || 0;
      var net = profit - loss;
      statProfit.textContent = '+' + fmt(profit);
      statLoss.textContent = '-' + fmt(loss);
      statNet.textContent = (net >= 0 ? '+' : '') + fmt(net);
      statNet.className = 'stat-value ' + (net > 0 ? 'pos' : net < 0 ? 'neg' : 'neu');

      var records = user.records || [];
      if (!records.length) {
        listEl.innerHTML = '<div class="empty">暂无余额记录</div>';
        return;
      }

      listEl.innerHTML = '';
      records.slice(0, 150).forEach(function (r) {
        var amt = Number(r.amount) || 0;
        var el = document.createElement('div');
        el.className = 'card-item';
        el.innerHTML =
          '<div class="item-main">' +
            '<div class="item-name">' + esc(r.title) + '</div>' +
            '<div class="item-meta">' +
              '<span>' + esc(r.date) + '</span>' +
              (r.balance !== undefined ? '<span class="bal">余额 ' + fmt(r.balance) + '</span>' : '') +
            '</div>' +
          '</div>' +
          '<div class="item-value ' + (amt >= 0 ? 'pos' : 'neg') + '">' + (amt >= 0 ? '+' : '') + fmt(amt) + '</div>';
        listEl.appendChild(el);
      });
    }

    document.getElementById('refreshBtn').addEventListener('click', render);
    render();
    document.addEventListener('visibilitychange', function () { if (!document.hidden) render(); });
  })();
</script>
</body>
</html>
