<!DOCTYPE html>
<html lang="zh" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>空月平台 · 记录</title>
<script>(function(){try{var t=localStorage.getItem('kongyue_theme')||'dark';document.documentElement.setAttribute('data-theme',t)}catch(e){}})()</script>
<style>
:root{
  --bg1:#0b0f1a;--bg2:#141b2b;
  --card:rgba(18,25,40,.75);--card-solid:#121a28;--card-h:rgba(24,33,52,.9);
  --border:rgba(255,255,255,.06);--border-h:rgba(120,160,255,.25);
  --t:#eef4ff;--t2:#8fa3c9;--t3:#7f93b8;
  --input:rgba(8,14,24,.7);--input-bd:#253248;
  --nav-bg:rgba(18,25,40,.85);
  --accent:#5b8cff;--accent2:#3b66b0;--accent-soft:rgba(91,140,255,.1);
  --pos:#6ee7a0;--neg:#ff8a9a;
  --pos-bg:rgba(60,200,120,.1);--pos-bd:rgba(80,220,140,.25);
  --neg-bg:rgba(255,80,100,.1);--neg-bd:rgba(255,100,120,.25);
  --shadow-sm:0 10px 28px -16px rgba(0,0,0,.9);
  --shadow-md:0 20px 50px -15px rgba(0,0,0,.8);
  --glow:rgba(80,140,255,.25);
  --ease:cubic-bezier(.16,1,.3,1);
}
[data-theme="light"]{
  --bg1:#eef2f9;--bg2:#dbe4f2;
  --card:rgba(255,255,255,.82);--card-solid:#ffffff;--card-h:rgba(250,252,255,.95);
  --border:rgba(15,30,60,.08);--border-h:rgba(59,102,176,.25);
  --t:#17253d;--t2:#5a6b85;--t3:#7a8aa3;
  --input:rgba(240,244,250,.9);--input-bd:#cbd6e6;
  --nav-bg:rgba(255,255,255,.82);
  --accent:#3b66b0;--accent2:#2a4d8f;--accent-soft:rgba(59,102,176,.1);
  --pos:#199f4f;--neg:#d92b3a;
  --pos-bg:rgba(25,159,79,.1);--pos-bd:rgba(25,159,79,.22);
  --neg-bg:rgba(217,43,58,.08);--neg-bd:rgba(217,43,58,.22);
  --shadow-sm:0 10px 28px -16px rgba(50,80,140,.25);
  --shadow-md:0 20px 50px -15px rgba(50,80,140,.25);
  --glow:rgba(90,140,220,.2);
}
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif;-webkit-tap-highlight-color:transparent}
body{background:linear-gradient(145deg,var(--bg1) 0%,var(--bg2) 100%);min-height:100vh;color:var(--t);padding-bottom:2.5rem;position:relative;overflow-x:hidden;
  opacity:0;transform:translateY(6px);
  transition:opacity .45s var(--ease),transform .45s var(--ease),background .5s var(--ease),color .3s var(--ease)}
body.page-loaded{opacity:1;transform:translateY(0)}
body.page-leaving{opacity:0;transform:translateY(-6px) scale(.99)}
body::before{content:'';position:fixed;top:-30%;left:-20%;width:70%;height:70%;background:radial-gradient(circle,var(--glow) 0%,transparent 65%);filter:blur(80px);pointer-events:none;z-index:0;opacity:.6;animation:floatA 24s ease-in-out infinite}
@keyframes floatA{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(70px,-50px) scale(1.12)}}

.navbar{position:sticky;top:0;z-index:100;background:var(--nav-bg);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:.85rem 1.1rem;box-shadow:0 8px 24px -12px rgba(0,0,0,.35);transition:background .5s var(--ease),border-color .3s var(--ease)}
.nav-inner{max-width:960px;margin:0 auto;width:100%;display:flex;align-items:center;justify-content:space-between;gap:1rem}
.brand{font-size:1.05rem;font-weight:600;letter-spacing:.02em;color:var(--t);white-space:nowrap;display:flex;align-items:center;gap:8px}
.brand::before{content:'';width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 0 12px var(--accent-soft);transition:transform .5s var(--ease)}
.brand:hover::before{transform:rotate(180deg) scale(1.1)}
.brand span{color:var(--accent);font-weight:300}
.nav-links{display:flex;gap:.25rem;align-items:center}
.nav-link{text-decoration:none;color:var(--t2);font-size:.82rem;font-weight:500;padding:.45rem .9rem;border-radius:20px;transition:all .3s var(--ease);letter-spacing:.3px;white-space:nowrap}
.nav-link:hover{color:var(--t);background:rgba(127,127,127,.08);transform:translateY(-1px)}
.nav-link.active{color:#fff;background:linear-gradient(135deg,var(--accent2),var(--accent));box-shadow:0 4px 12px -4px rgba(59,102,176,.6),inset 0 0 0 1px rgba(255,255,255,.15)}
.theme-btn{width:34px;height:34px;border-radius:50%;background:var(--input);border:1px solid var(--border);color:var(--t2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .35s var(--ease);flex-shrink:0;margin-left:.4rem}
.theme-btn:hover{color:var(--accent);border-color:var(--accent);transform:rotate(20deg) scale(1.08)}
.theme-btn svg{width:15px;height:15px}
[data-theme="dark"] .i-sun{display:block}[data-theme="dark"] .i-moon{display:none}
[data-theme="light"] .i-sun{display:none}[data-theme="light"] .i-moon{display:block}

.container{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:1.4rem 1.1rem 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem;margin-bottom:1.3rem}
.stat{background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1.5px solid var(--border);border-radius:18px;padding:.9rem .7rem;text-align:center;
  box-shadow:var(--shadow-sm);transition:all .4s var(--ease);
  animation:cardIn .6s var(--ease) both}
.stat:nth-child(1){animation-delay:.05s}.stat:nth-child(2){animation-delay:.1s}.stat:nth-child(3){animation-delay:.15s}
.stat:hover{transform:translateY(-4px);border-color:var(--border-h);box-shadow:var(--shadow-md)}
@keyframes cardIn{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.stat-label{font-size:.6rem;color:var(--t2);letter-spacing:1px;text-transform:uppercase;margin-bottom:.35rem;font-weight:600}
.stat-value{font-size:1rem;font-weight:700;letter-spacing:.2px;font-variant-numeric:tabular-nums}
.stat-value.pos{color:var(--pos)}
.stat-value.neg{color:var(--neg)}
.page-title{font-size:1.35rem;font-weight:600;letter-spacing:-.01em;margin-bottom:.3rem;animation:upIn .7s .05s var(--ease) both}
.page-sub{font-size:.75rem;color:var(--t2);margin-bottom:1rem;display:flex;justify-content:space-between;align-items:center;animation:upIn .7s .1s var(--ease) both}
@keyframes upIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
.refresh{background:rgba(127,127,127,.08);border:1px solid var(--border);color:var(--t2);
  padding:.32rem .85rem;border-radius:12px;font-size:.7rem;font-weight:600;cursor:pointer;
  transition:all .3s var(--ease);font-family:inherit;letter-spacing:.3px}
.refresh:hover{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);transform:translateY(-1px)}
.refresh:active{transform:translateY(0) scale(.97)}

.list{display:flex;flex-direction:column;gap:.7rem}
.rec{background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1.5px solid var(--border);border-radius:18px;padding:.95rem 1.15rem;
  display:flex;justify-content:space-between;align-items:center;gap:1rem;
  box-shadow:var(--shadow-sm);transition:all .4s var(--ease);position:relative;overflow:hidden;
  animation:cardIn .5s var(--ease) both}
.rec::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--accent),var(--accent2));transform:scaleY(0);transition:transform .4s var(--ease);transform-origin:center}
.rec:hover{transform:translateX(6px);border-color:var(--border-h);box-shadow:var(--shadow-md);background:var(--card-h)}
.rec:hover::before{transform:scaleY(1)}
.rec-main{flex:1;min-width:0}
.rec-title{font-size:.9rem;font-weight:600;color:var(--t);letter-spacing:.2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:.3rem}
.rec-meta{font-size:.67rem;color:var(--t3);letter-spacing:.3px;display:flex;gap:.7rem;flex-wrap:wrap}
.rec-meta .bal{color:var(--t3)}
.rec-amount{font-size:1rem;font-weight:700;white-space:nowrap;letter-spacing:.2px;font-variant-numeric:tabular-nums}
.rec-amount.pos{color:var(--pos)}
.rec-amount.neg{color:var(--neg)}
.empty{text-align:center;padding:3.5rem 1rem;color:var(--t3);font-size:.85rem;background:var(--card);border:1px dashed var(--border);border-radius:20px;animation:cardIn .6s var(--ease) both}

@media(min-width:760px){
  .container{padding:1.8rem 1.5rem 0}
  .navbar{padding:.95rem 1.5rem}
  .brand{font-size:1.15rem}
  .nav-link{font-size:.85rem;padding:.5rem 1.1rem}
}
@media(max-width:420px){
  .navbar{padding:.75rem .9rem}
  .brand{font-size:.95rem}
  .brand::before{width:16px;height:16px}
  .nav-link{padding:.4rem .7rem;font-size:.76rem}
  .container{padding:1.1rem .9rem 0}
  .stat{padding:.75rem .5rem;border-radius:16px}
  .stat-value{font-size:.9rem}
  .stat-label{font-size:.55rem;letter-spacing:.6px}
  .page-title{font-size:1.2rem}
  .rec{padding:.85rem 1rem;border-radius:16px}
  .rec:hover{transform:none}
  .rec-title{font-size:.85rem}
  .rec-amount{font-size:.9rem}
}
</style>
</head>
<body>
<nav class="navbar">
  <div class="nav-inner">
    <div class="brand">空月 <span>·</span> 平台</div>
    <div class="nav-links">
      <a href="home.html" class="nav-link">主页</a>
      <a href="records.html" class="nav-link active">记录</a>
      <a href="profile.html" class="nav-link">个人</a>
      <button class="theme-btn" onclick="toggleTheme()" aria-label="切换主题">
        <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </div>
</nav>

<main class="container">
  <div class="page-title">余额记录</div>
  <div class="page-sub"><span>账户余额增减明细</span><button class="refresh" id="refreshBtn">刷新</button></div>
  <div class="stats">
    <div class="stat"><div class="stat-label">累计收益</div><div class="stat-value pos" id="statProfit">+0.00</div></div>
    <div class="stat"><div class="stat-label">累计亏损</div><div class="stat-value neg" id="statLoss">-0.00</div></div>
    <div class="stat"><div class="stat-label">净盈亏</div><div class="stat-value" id="statNet">0.00</div></div>
  </div>
  <div id="list" class="list"><div class="empty">正在加载记录…</div></div>
</main>

<script>
window.toggleTheme=function(){var c=document.documentElement.getAttribute('data-theme');var n=c==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);try{localStorage.setItem('kongyue_theme',n)}catch(e){}};
document.addEventListener('DOMContentLoaded',function(){document.body.classList.add('page-loaded')});
document.addEventListener('click',function(e){var a=e.target.closest('a[href$=".html"]');if(!a||a.target==='_blank')return;e.preventDefault();document.body.classList.add('page-leaving');setTimeout(function(){window.location.href=a.href},220)});
(function(){
"use strict";
var UK='kongyue_users_v1',SK='kongyue_session_v1';
function LU(){try{var r=localStorage.getItem(UK);return r?JSON.parse(r):{}}catch(e){return{}}}
function GS(){try{return localStorage.getItem(SK)||null}catch(e){return null}}
function GCU(){var s=GS();if(!s)return null;var u=LU();return u[s]||null}
if(!GCU()){window.location.href='index.html';return}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function fmt(n,d){return Number(n).toFixed(d===undefined?2:d)}
var listEl=document.getElementById('list'),statProfit=document.getElementById('statProfit'),statLoss=document.getElementById('statLoss'),statNet=document.getElementById('statNet');
function render(){
  var u=GCU();if(!u){window.location.href='index.html';return}
  var profit=u.stats.totalProfit||0,loss=u.stats.totalLoss||0,net=profit-loss;
  statProfit.textContent='+'+fmt(profit);
  statLoss.textContent='-'+fmt(loss);
  statNet.textContent=(net>=0?'+':'')+fmt(net);
  statNet.className='stat-value '+(net>0?'pos':net<0?'neg':'');
  var recs=u.records||[];
  if(!recs.length){listEl.innerHTML='<div class="empty">暂无余额记录</div>';return}
  listEl.innerHTML='';
  recs.slice(0,150).forEach(function(r,i){
    var amt=Number(r.amount)||0;
    var el=document.createElement('div');el.className='rec';el.style.animationDelay=(Math.min(i,20)*0.02)+'s';
    var balanceStr=(r.balance!==undefined)?'余额 '+fmt(r.balance):'';
    var profitStr=(r.profit!==undefined)?'累计盈亏 '+((r.profit>=0?'+':'')+fmt(r.profit)):'';
    el.innerHTML='<div class="rec-main"><div class="rec-title">'+esc(r.title)+'</div><div class="rec-meta"><span>'+esc(r.date)+'</span><span class="bal">'+balanceStr+'</span>'+(profitStr?'<span>'+profitStr+'</span>':'')+'</div></div><div class="rec-amount '+(amt>=0?'pos':'neg')+'">'+(amt>=0?'+':'')+fmt(amt)+'</div>';
    listEl.appendChild(el);
  });
}
document.getElementById('refreshBtn').addEventListener('click',render);
render();
document.addEventListener('visibilitychange',function(){if(!document.hidden)render()});
})();
</script>
</body>
</html>
