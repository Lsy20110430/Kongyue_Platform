<!DOCTYPE html>
<html lang="zh" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>空月平台 · 主页</title>
<script>(function(){try{var t=localStorage.getItem('kongyue_theme')||'dark';document.documentElement.setAttribute('data-theme',t)}catch(e){}})()</script>
<style>
:root{
  --bg1:#0b0f1a;--bg2:#141b2b;
  --card:rgba(18,25,40,.75);--card-solid:#121a28;--card-h:rgba(24,33,52,.9);
  --border:rgba(255,255,255,.06);--border-h:rgba(120,160,255,.25);
  --t:#eef4ff;--t2:#8fa3c9;--t3:#7f93b8;
  --input:rgba(8,14,24,.7);--input-bd:#253248;
  --nav-bg:rgba(18,25,40,.85);
  --accent:#5b8cff;--accent2:#3b66b0;--accent-soft:rgba(91,140,255,.1);
  --pos:#6ee7a0;--neg:#ff8a9a;
  --pos-bg:rgba(60,200,120,.1);--pos-bd:rgba(80,220,140,.25);
  --neg-bg:rgba(255,80,100,.1);--neg-bd:rgba(255,100,120,.25);
  --info-bg:rgba(91,140,255,.08);--info-bd:rgba(91,140,255,.25);
  --risk-low-bg:rgba(60,200,120,.1);--risk-low-t:#8ce0ac;--risk-low-bd:rgba(80,220,140,.25);
  --risk-mid-bg:rgba(255,190,60,.1);--risk-mid-t:#ffd98a;--risk-mid-bd:rgba(255,190,60,.25);
  --risk-high-bg:rgba(255,80,100,.09);--risk-high-t:#ff9aa9;--risk-high-bd:rgba(255,100,120,.25);
  --industry-bg:rgba(91,140,255,.1);--industry-t:#a8c2ff;--industry-bd:rgba(91,140,255,.22);
  --shadow-sm:0 10px 28px -16px rgba(0,0,0,.9);
  --shadow-md:0 20px 50px -15px rgba(0,0,0,.8);
  --glow:rgba(80,140,255,.25);
  --ov:rgba(0,0,0,.7);
  --ease:cubic-bezier(.16,1,.3,1);
}
[data-theme="light"]{
  --bg1:#eef2f9;--bg2:#dbe4f2;
  --card:rgba(255,255,255,.82);--card-solid:#ffffff;--card-h:rgba(250,252,255,.95);
  --border:rgba(15,30,60,.08);--border-h:rgba(59,102,176,.25);
  --t:#17253d;--t2:#5a6b85;--t3:#7a8aa3;
  --input:rgba(240,244,250,.9);--input-bd:#cbd6e6;
  --nav-bg:rgba(255,255,255,.82);
  --accent:#3b66b0;--accent2:#2a4d8f;--accent-soft:rgba(59,102,176,.1);
  --pos:#199f4f;--neg:#d92b3a;
  --pos-bg:rgba(25,159,79,.1);--pos-bd:rgba(25,159,79,.22);
  --neg-bg:rgba(217,43,58,.08);--neg-bd:rgba(217,43,58,.22);
  --info-bg:rgba(59,102,176,.08);--info-bd:rgba(59,102,176,.22);
  --risk-low-bg:rgba(25,159,79,.1);--risk-low-t:#199f4f;--risk-low-bd:rgba(25,159,79,.22);
  --risk-mid-bg:rgba(230,150,20,.12);--risk-mid-t:#b87200;--risk-mid-bd:rgba(230,150,20,.28);
  --risk-high-bg:rgba(217,43,58,.08);--risk-high-t:#d92b3a;--risk-high-bd:rgba(217,43,58,.22);
  --industry-bg:rgba(59,102,176,.1);--industry-t:#3b66b0;--industry-bd:rgba(59,102,176,.22);
  --shadow-sm:0 10px 28px -16px rgba(50,80,140,.25);
  --shadow-md:0 20px 50px -15px rgba(50,80,140,.25);
  --glow:rgba(90,140,220,.2);
  --ov:rgba(30,50,90,.35);
}
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif;-webkit-tap-highlight-color:transparent}
body{background:linear-gradient(145deg,var(--bg1) 0%,var(--bg2) 100%);min-height:100vh;color:var(--t);
  opacity:0;transform:translateY(6px);
  transition:opacity .45s var(--ease),transform .45s var(--ease),background .5s var(--ease),color .3s var(--ease);
  padding-bottom:3rem;position:relative;overflow-x:hidden}
body.page-loaded{opacity:1;transform:translateY(0)}
body.page-leaving{opacity:0;transform:translateY(-6px) scale(.99)}
body::before{content:'';position:fixed;top:-30%;left:-20%;width:70%;height:70%;background:radial-gradient(circle,var(--glow) 0%,transparent 65%);filter:blur(80px);pointer-events:none;z-index:0;opacity:.6;animation:floatA 24s ease-in-out infinite}
@keyframes floatA{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(70px,-50px) scale(1.12)}}

.navbar{position:sticky;top:0;z-index:100;background:var(--nav-bg);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:.85rem 1.1rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;box-shadow:0 8px 24px -12px rgba(0,0,0,.35);transition:background .5s var(--ease),border-color .3s var(--ease)}
.nav-inner{max-width:960px;margin:0 auto;width:100%;display:flex;align-items:center;justify-content:space-between;gap:1rem}
.brand{font-size:1.05rem;font-weight:600;letter-spacing:.02em;color:var(--t);white-space:nowrap;display:flex;align-items:center;gap:8px;transition:all .3s var(--ease)}
.brand::before{content:'';width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 0 12px var(--accent-soft);transition:transform .5s var(--ease)}
.brand:hover::before{transform:rotate(180deg) scale(1.1)}
.brand span{color:var(--accent);font-weight:300}
.nav-links{display:flex;gap:.25rem;align-items:center}
.nav-link{text-decoration:none;color:var(--t2);font-size:.82rem;font-weight:500;padding:.45rem .9rem;border-radius:20px;transition:all .3s var(--ease);letter-spacing:.3px;white-space:nowrap;position:relative}
.nav-link:hover{color:var(--t);background:rgba(127,127,127,.08);transform:translateY(-1px)}
.nav-link.active{color:#fff;background:linear-gradient(135deg,var(--accent2),var(--accent));box-shadow:0 4px 12px -4px rgba(59,102,176,.6),inset 0 0 0 1px rgba(255,255,255,.15)}
[data-theme="light"] .nav-link.active{color:#fff}
.theme-btn{width:34px;height:34px;border-radius:50%;background:var(--input);border:1px solid var(--border);color:var(--t2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .35s var(--ease);flex-shrink:0;margin-left:.4rem}
.theme-btn:hover{color:var(--accent);border-color:var(--accent);transform:rotate(20deg) scale(1.08)}
.theme-btn:active{transform:rotate(20deg) scale(.94)}
.theme-btn svg{width:15px;height:15px}
[data-theme="dark"] .i-sun{display:block}[data-theme="dark"] .i-moon{display:none}
[data-theme="light"] .i-sun{display:none}[data-theme="light"] .i-moon{display:block}

.container{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:1.4rem 1.1rem 0}

.balance-bar{position:relative;background:var(--card);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-radius:24px;padding:1.3rem 1.4rem;border:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;gap:1rem;
  margin-bottom:1.4rem;overflow:hidden;
  box-shadow:var(--shadow-sm),inset 0 1px 2px rgba(255,255,255,.05);
  transition:all .4s var(--ease);animation:cardIn .8s var(--ease) both}
.balance-bar::before{content:'';position:absolute;top:-100%;right:-30%;width:60%;height:300%;background:radial-gradient(circle,var(--accent-soft) 0%,transparent 60%);pointer-events:none}
.balance-bar:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:var(--border-h)}
@keyframes cardIn{from{opacity:0;transform:translateY(30px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.balance-info{flex:1;min-width:0;position:relative;z-index:1}
.balance-label{font-size:.65rem;color:var(--t2);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:.3rem;font-weight:600}
.balance-value{font-size:1.7rem;font-weight:700;color:var(--pos);letter-spacing:.3px;transition:color .3s var(--ease);font-variant-numeric:tabular-nums}
.balance-value.loss{color:var(--neg)}
.balance-value.big-win{animation:flashG .8s var(--ease)}
.balance-value.big-loss{animation:flashR .8s var(--ease)}
@keyframes flashG{0%,100%{transform:scale(1)}45%{transform:scale(1.09);text-shadow:0 0 30px rgba(60,220,130,.7)}}
@keyframes flashR{0%,100%{transform:scale(1)}45%{transform:scale(1.09);text-shadow:0 0 30px rgba(255,80,100,.7)}}
.balance-delta{font-size:.72rem;font-weight:700;padding:.35rem .75rem;border-radius:12px;background:var(--pos-bg);color:var(--pos);border:1px solid var(--pos-bd);white-space:nowrap;opacity:0;transform:translateY(8px);transition:all .35s var(--ease);position:relative;z-index:1}
.balance-delta.show{opacity:1;transform:translateY(0)}
.balance-delta.loss{background:var(--neg-bg);color:var(--neg);border-color:var(--neg-bd)}

.page-title{font-size:1.35rem;font-weight:600;letter-spacing:-.01em;margin-bottom:.3rem;animation:upIn .7s .05s var(--ease) both}
.page-sub{font-size:.75rem;color:var(--t2);margin-bottom:1rem;letter-spacing:.3px;display:flex;align-items:center;justify-content:space-between;animation:upIn .7s .1s var(--ease) both}
@keyframes upIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
.settle-dot{font-size:.68rem;color:var(--pos);display:flex;align-items:center;gap:.35rem;font-weight:600}
.settle-dot::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--pos);box-shadow:0 0 0 0 var(--pos);animation:pulse 1.8s var(--ease) infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(60,200,120,.5)}70%{box-shadow:0 0 0 10px rgba(60,200,120,0)}100%{box-shadow:0 0 0 0 rgba(60,200,120,0)}}

.list{display:grid;grid-template-columns:1fr;gap:.85rem}
.card-item{position:relative;background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-radius:22px;padding:1.1rem 1.2rem;border:1.5px solid var(--border);
  box-shadow:var(--shadow-sm),inset 0 1px 2px rgba(255,255,255,.04);
  transition:all .4s var(--ease);overflow:hidden;
  animation:cardIn .6s var(--ease) both}
.card-item::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--accent2));transform:scaleX(0);transform-origin:left;transition:transform .5s var(--ease)}
.card-item:hover{transform:translateY(-4px);border-color:var(--border-h);box-shadow:var(--shadow-md);background:var(--card-h)}
.card-item:hover::before{transform:scaleX(1)}
.card-item.invested{border-color:var(--accent)}
.card-item.invested::before{transform:scaleX(1)}
.item-row{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem}
.item-main{flex:1;min-width:0}
.item-name{font-size:1rem;font-weight:600;color:var(--t);letter-spacing:.2px}
.item-tags{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.5rem}
.tag{display:inline-block;font-size:.62rem;font-weight:600;padding:.2rem .6rem;border-radius:10px;letter-spacing:.4px;transition:transform .3s var(--ease)}
.tag:hover{transform:scale(1.05)}
.tag-industry{background:var(--industry-bg);color:var(--industry-t);border:1px solid var(--industry-bd)}
.risk-low{background:var(--risk-low-bg);color:var(--risk-low-t);border:1px solid var(--risk-low-bd)}
.risk-mid{background:var(--risk-mid-bg);color:var(--risk-mid-t);border:1px solid var(--risk-mid-bd)}
.risk-high{background:var(--risk-high-bg);color:var(--risk-high-t);border:1px solid var(--risk-high-bd)}
.item-rate{text-align:right;flex-shrink:0}
.rate-value{font-size:1.2rem;font-weight:700;letter-spacing:.2px;font-variant-numeric:tabular-nums}
.rate-value.pos{color:var(--pos)}
.rate-value.neg{color:var(--neg)}
.rate-range{font-size:.65rem;color:var(--t3);margin-top:.25rem;letter-spacing:.3px}
.item-actions{display:flex;gap:.55rem;margin-top:.9rem}
.btn-sm{position:relative;flex:1;border:none;padding:.6rem .9rem;border-radius:14px;font-weight:600;font-size:.78rem;cursor:pointer;transition:all .3s var(--ease);letter-spacing:.4px;font-family:inherit;overflow:hidden}
.btn-invest{background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;box-shadow:0 4px 12px -4px rgba(59,102,176,.5),inset 0 0 0 1px rgba(255,255,255,.15)}
.btn-invest:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 10px 20px -6px rgba(59,102,176,.7)}
.btn-invest:active{transform:translateY(0) scale(.98)}
.btn-invest:disabled{opacity:.35;cursor:not-allowed;filter:grayscale(.5)}
.btn-withdraw{background:rgba(127,127,127,.08);color:var(--t2);border:1px solid var(--border)}
.btn-withdraw:hover{background:rgba(127,127,127,.15);transform:translateY(-2px);color:var(--t)}
.btn-withdraw:active{transform:translateY(0) scale(.98)}
.invest-info{margin-top:.75rem;padding-top:.75rem;border-top:1px dashed var(--border);display:flex;justify-content:space-between;gap:.8rem;font-size:.72rem}
.invest-info .k{color:var(--t2)}
.invest-info .v{color:var(--t);font-weight:600;font-variant-numeric:tabular-nums}
.invest-info .v.pos{color:var(--pos)}
.invest-info .v.neg{color:var(--neg)}
.loading{grid-column:1/-1;text-align:center;padding:3rem 1rem;color:var(--t2);font-size:.85rem}

.float-tip{position:fixed;left:50%;top:80px;transform:translate(-50%,-16px) scale(.95);
  background:var(--card-solid);color:var(--t);border:1px solid var(--border);
  padding:.75rem 1.4rem;border-radius:30px;font-size:.82rem;font-weight:600;
  opacity:0;pointer-events:none;transition:all .4s var(--ease);z-index:500;
  box-shadow:0 20px 50px -15px rgba(0,0,0,.5);white-space:nowrap;letter-spacing:.3px}
.float-tip.show{opacity:1;transform:translate(-50%,0) scale(1)}
.float-tip.win{color:var(--pos);border-color:var(--pos-bd)}
.float-tip.loss{color:var(--neg);border-color:var(--neg-bd)}
.float-tip.big{animation:tipPop .5s var(--ease)}
@keyframes tipPop{0%{transform:translate(-50%,0) scale(.85)}50%{transform:translate(-50%,0) scale(1.08)}100%{transform:translate(-50%,0) scale(1)}}

.ov{position:fixed;inset:0;background:var(--ov);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;z-index:900;padding:1.2rem;animation:fadeIn .25s var(--ease)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--card-solid);border-radius:28px;padding:1.6rem 1.5rem 1.4rem;max-width:400px;width:100%;box-shadow:0 40px 80px -20px rgba(0,0,0,.7);border:1px solid var(--border);animation:modalIn .4s var(--ease)}
@keyframes modalIn{from{opacity:0;transform:translateY(28px) scale(.94)}60%{transform:translateY(-2px) scale(1.01)}to{opacity:1;transform:translateY(0) scale(1)}}
.modal h3{font-size:1.1rem;color:var(--t);margin-bottom:.4rem;font-weight:600;letter-spacing:-.01em}
.modal-desc{font-size:.82rem;color:var(--t2);line-height:1.7;margin-bottom:1.1rem;letter-spacing:.2px}
.modal-input{width:100%;background:var(--input);border:1.5px solid var(--input-bd);border-radius:30px;padding:.8rem 1.1rem;color:var(--t);font-size:.9rem;outline:none;font-family:inherit;margin-bottom:.5rem;transition:all .3s var(--ease)}
.modal-input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--info-bg)}
.modal-input::placeholder{color:var(--t3)}
.modal-hint{font-size:.68rem;color:var(--t3);margin-bottom:.9rem;letter-spacing:.3px;padding-left:.3rem;min-height:.9rem}
.modal-hint.warn{color:var(--neg)}
.modal-actions{display:flex;gap:.6rem;margin-top:.4rem}
.modal-actions button{flex:1;border:none;padding:.8rem;border-radius:30px;font-weight:600;font-size:.85rem;cursor:pointer;transition:all .3s var(--ease);letter-spacing:.5px;font-family:inherit}
.modal-btn-primary{background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;box-shadow:0 6px 14px -4px rgba(59,102,176,.5),inset 0 0 0 1px rgba(255,255,255,.15)}
.modal-btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 20px -6px rgba(59,102,176,.7)}
.modal-btn-primary:active{transform:translateY(0) scale(.98)}
.modal-btn-ghost{background:rgba(127,127,127,.08);color:var(--t2);border:1px solid var(--border)}
.modal-btn-ghost:hover{background:rgba(127,127,127,.15);color:var(--t)}
.modal-btn-danger{background:linear-gradient(135deg,#c92e3e,var(--neg));color:#fff;box-shadow:0 6px 14px -4px rgba(217,43,58,.5)}
.modal-btn-danger:hover{transform:translateY(-2px);filter:brightness(1.05)}

.hidden{display:none!important}

@media(min-width:760px){
  .list{grid-template-columns:repeat(2,1fr);gap:1rem}
  .container{padding:1.8rem 1.5rem 0}
  .navbar{padding:.95rem 1.5rem}
  .brand{font-size:1.15rem}
  .nav-link{font-size:.85rem;padding:.5rem 1.1rem}
}
@media(max-width:420px){
  .navbar{padding:.75rem .9rem}
  .brand{font-size:.95rem}
  .brand::before{width:16px;height:16px}
  .nav-link{padding:.4rem .7rem;font-size:.76rem}
  .container{padding:1.1rem .9rem 0}
  .balance-bar{padding:1.1rem 1.1rem;border-radius:20px}
  .balance-value{font-size:1.45rem}
  .card-item{padding:1rem 1rem;border-radius:20px}
  .item-name{font-size:.95rem}
  .rate-value{font-size:1.1rem}
}
</style>
</head>
<body>

<nav class="navbar">
  <div class="nav-inner">
    <div class="brand">空月 <span>·</span> 平台</div>
    <div class="nav-links">
      <a href="home.html" class="nav-link active">主页</a>
      <a href="records.html" class="nav-link">记录</a>
      <a href="profile.html" class="nav-link">个人</a>
      <button class="theme-btn" onclick="toggleTheme()" aria-label="切换主题">
        <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </div>
</nav>

<main class="container">
  <div class="balance-bar">
    <div class="balance-info">
      <div class="balance-label">账户余额</div>
      <div class="balance-value" id="balanceText">0.00</div>
    </div>
    <div class="balance-delta" id="balanceDelta">+0.00</div>
  </div>
  <div class="page-title">在投项目</div>
  <div class="page-sub">
    <span>实时结算 · 每 5 秒一次</span>
    <span class="settle-dot">运行中</span>
  </div>
  <div id="list" class="list"><div class="loading">正在加载…</div></div>
</main>

<div id="floatTip" class="float-tip">已结算</div>
<div id="modalRoot"></div>

<script>
window.toggleTheme=function(){var c=document.documentElement.getAttribute('data-theme');var n=c==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);try{localStorage.setItem('kongyue_theme',n)}catch(e){}};
document.addEventListener('DOMContentLoaded',function(){document.body.classList.add('page-loaded')});
document.addEventListener('click',function(e){var a=e.target.closest('a[href$=".html"]');if(!a||a.target==='_blank')return;e.preventDefault();document.body.classList.add('page-leaving');setTimeout(function(){window.location.href=a.href},220)});
(function(){
"use strict";
var UK='kongyue_users_v1',SK='kongyue_session_v1';
var RC={
  low:{label:'低风险',rateMin:8,rateMax:18,lossChance:0.46,normalMin:0.6,normalMax:1.1,bigChance:0.05,bigMin:2,bigMax:3.5},
  mid:{label:'中风险',rateMin:15,rateMax:32,lossChance:0.50,normalMin:0.7,normalMax:1.3,bigChance:0.06,bigMin:2.5,bigMax:4.5},
  high:{label:'高风险',rateMin:25,rateMax:60,lossChance:0.54,normalMin:0.8,normalMax:1.5,bigChance:0.08,bigMin:3,bigMax:6}
};
function LU(){try{var r=localStorage.getItem(UK);return r?JSON.parse(r):{}}catch(e){return{}}}
function SU(u){try{localStorage.setItem(UK,JSON.stringify(u))}catch(e){}}
function GS(){try{return localStorage.getItem(SK)||null}catch(e){return null}}
function GCU(){var s=GS();if(!s)return null;var u=LU();return u[s]||null}
function SCU(user){var u=LU();u[user.username]=user;SU(u)}
var cu=GCU();
if(!cu){window.location.href='index.html';return}
function nowStr(){var d=new Date(),p=function(n){return String(n).padStart(2,'0')};return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds())}
var balanceText=document.getElementById('balanceText'),balanceDelta=document.getElementById('balanceDelta'),listEl=document.getElementById('list'),floatTip=document.getElementById('floatTip'),modalRoot=document.getElementById('modalRoot');
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function fmt(n,d){return Number(n).toFixed(d===undefined?2:d)}
function rand(a,b){return a+Math.random()*(b-a)}

function showAlert(o){
  var ov=document.createElement('div');ov.className='ov';
  var bc=o.type==='danger'?'modal-btn-danger':'modal-btn-primary';
  ov.innerHTML='<div class="modal"><h3>'+esc(o.title||'提示')+'</h3>'+(o.desc?'<div class="modal-desc">'+o.desc+'</div>':'')+'<div class="modal-actions"><button class="'+bc+'" data-act="ok">'+esc(o.confirmText||'确定')+'</button></div></div>';
  modalRoot.appendChild(ov);
  var ok=ov.querySelector('[data-act="ok"]');
  function close(){ov.style.opacity='0';ov.style.transition='opacity .2s';setTimeout(function(){ov.remove();if(o.onConfirm)o.onConfirm()},180)}
  ok.addEventListener('click',close);ov.addEventListener('click',function(e){if(e.target===ov)close()});
}
function showConfirm(o){
  var ov=document.createElement('div');ov.className='ov';
  var bc=o.type==='danger'?'modal-btn-danger':'modal-btn-primary';
  ov.innerHTML='<div class="modal"><h3>'+esc(o.title||'确认操作')+'</h3>'+(o.desc?'<div class="modal-desc">'+o.desc+'</div>':'')+'<div class="modal-actions"><button class="modal-btn-ghost" data-act="cancel">'+esc(o.cancelText||'取消')+'</button><button class="'+bc+'" data-act="ok">'+esc(o.confirmText||'确定')+'</button></div></div>';
  modalRoot.appendChild(ov);
  function close(){ov.style.opacity='0';ov.style.transition='opacity .2s';setTimeout(function(){ov.remove()},180)}
  ov.querySelector('[data-act="cancel"]').addEventListener('click',close);
  ov.querySelector('[data-act="ok"]').addEventListener('click',function(){close();if(o.onConfirm)setTimeout(o.onConfirm,180)});
  ov.addEventListener('click',function(e){if(e.target===ov)close()});
}
function showPrompt(o){
  var ov=document.createElement('div');ov.className='ov';
  ov.innerHTML='<div class="modal"><h3>'+esc(o.title||'请输入')+'</h3>'+(o.desc?'<div class="modal-desc">'+o.desc+'</div>':'')+'<input class="modal-input" type="'+(o.inputType||'text')+'" placeholder="'+esc(o.placeholder||'')+'" value="'+esc(o.defaultValue||'')+'"><div class="modal-hint" data-hint>'+(o.hint||'')+'</div><div class="modal-actions"><button class="modal-btn-ghost" data-act="cancel">取消</button><button class="modal-btn-primary" data-act="ok">'+esc(o.confirmText||'确定')+'</button></div></div>';
  modalRoot.appendChild(ov);
  var input=ov.querySelector('.modal-input'),hint=ov.querySelector('[data-hint]');
  function close(){ov.style.opacity='0';ov.style.transition='opacity .2s';setTimeout(function(){ov.remove()},180)}
  ov.querySelector('[data-act="cancel"]').addEventListener('click',close);
  ov.querySelector('[data-act="ok"]').addEventListener('click',function(){
    var v=input.value;
    if(o.validate){var err=o.validate(v);if(err){hint.textContent=err;hint.classList.add('warn');input.focus();return}}
    close();if(o.onConfirm)setTimeout(function(){o.onConfirm(v)},180);
  });
  ov.addEventListener('click',function(e){if(e.target===ov)close()});
  setTimeout(function(){input.focus();input.select()},80);
  input.addEventListener('keydown',function(e){if(e.key==='Enter')ov.querySelector('[data-act="ok"]').click()});
}

function settleOnce(user){
  var now=Date.now(),totalDelta=0,hasInvest=false,maxAbs=0;
  user.projects.forEach(function(p){
    if(!p.invested||p.invested<=0)return;
    hasInvest=true;
    var cfg=RC[p.riskLevel]||RC.mid;
    var isLoss=Math.random()<cfg.lossChance;
    var dRate=p.rateMin+Math.random()*(p.rateMax-p.rateMin);
    var base=p.invested*(dRate/100)/50;
    var isBig=Math.random()<cfg.bigChance;
    var f=isBig?rand(cfg.bigMin,cfg.bigMax):rand(cfg.normalMin,cfg.normalMax);
    var delta=isLoss?-base*f:base*f;
    delta=Math.round(delta*100)/100;
    if(delta===0)delta=isLoss?-0.01:0.01;
    if(Math.abs(delta)>maxAbs)maxAbs=Math.abs(delta);
    p.invested=Math.round((p.invested+delta)*100)/100;
    if(p.invested<0)p.invested=0;
    p.profit=Math.round(((p.profit||0)+delta)*100)/100;
    p.settleCount=(p.settleCount||0)+1;
    totalDelta+=delta;
    if(delta>0)user.stats.totalProfit+=delta;else user.stats.totalLoss+=-delta;
    user.stats.settleCount++;
    var suffix=delta>0?(isBig?' · 大幅收益累积':' · 收益累积'):(isBig?' · 大幅亏损累积':' · 亏损累积');
    user.records.unshift({id:'r'+now+Math.random().toString(36).slice(2,7),date:nowStr(),title:p.name+suffix,amount:delta,invested:p.invested,profit:p.profit,balance:user.balance,projectId:p.id});
    p.currentRate=Math.round((p.rateMin+Math.random()*(p.rateMax-p.rateMin))*10)/10;
    p.lastUpdate=now;
  });
  if(user.records.length>200)user.records=user.records.slice(0,200);
  user.lastSettleAt=now;
  if(now-user.lastRiskAdjustAt>30000){
    var L=['low','mid','high'];
    user.projects.forEach(function(p){
      if(Math.random()<0.25){
        var i=L.indexOf(p.riskLevel),ni;
        if(i===0)ni=1;else if(i===2)ni=1;else ni=Math.random()<0.5?0:2;
        if(ni===i)return;
        var lv=L[ni],c=RC[lv];
        p.riskLevel=lv;p.riskLabel=c.label;p.rateMin=c.rateMin;p.rateMax=c.rateMax;
        p.currentRate=Math.round((c.rateMin+Math.random()*(c.rateMax-c.rateMin))*10)/10;
      }
    });
    user.lastRiskAdjustAt=now;
  }
  return{delta:totalDelta,hasInvest:hasInvest,maxAbs:maxAbs};
}
var dTimer=null;
function showDelta(d){
  if(d===0)return;
  balanceDelta.textContent=(d>0?'+':'')+fmt(d);
  balanceDelta.className='balance-delta show'+(d<0?' loss':'');
  if(dTimer)clearTimeout(dTimer);
  dTimer=setTimeout(function(){balanceDelta.classList.remove('show')},2400);
}
function showFloat(d,big){
  if(d===0)return;
  var t;
  if(d>0)t=(big?'本金大幅上涨 +':'本金上涨 +')+fmt(d)+' USDT';
  else t=(big?'本金大幅缩水 ':'本金缩水 ')+fmt(d)+' USDT';
  floatTip.textContent=t;
  floatTip.className='float-tip show'+(d<0?' loss':' win')+(big?' big':'');
  clearTimeout(showFloat._t);
  showFloat._t=setTimeout(function(){floatTip.className='float-tip'},2200);
}
function render(user,delta,big){
  balanceText.textContent=fmt(user.balance)+' USDT';
  var cls='balance-value';
  if(delta<0)cls+=' loss';
  if(big&&delta>0)cls+=' big-win';
  if(big&&delta<0)cls+=' big-loss';
  balanceText.className=cls;
  if(delta)showDelta(delta);
  listEl.innerHTML='';
  user.projects.forEach(function(p,i){
    var lvl=['low','mid','high'].indexOf(p.riskLevel)>=0?p.riskLevel:'mid';
    var has=p.invested>0;
    var el=document.createElement('div');
    el.className='card-item'+(has?' invested':'');
    el.style.animationDelay=(Math.min(i,8)*0.05)+'s';
    var actions='';
    if(has){
      var pr=p.profit||0;
      actions='<div class="item-actions"><button class="btn-sm btn-invest" data-act="add" data-id="'+p.id+'">追加投资</button><button class="btn-sm btn-withdraw" data-act="withdraw" data-id="'+p.id+'">撤资</button></div>'+
      '<div class="invest-info"><div><span class="k">当前本金</span> <span class="v">'+fmt(p.invested)+'</span></div><div><span class="k">累计盈亏</span> <span class="v '+(pr>=0?'pos':'neg')+'">'+(pr>=0?'+':'')+fmt(pr)+'</span></div></div>';
    }else{
      actions='<div class="item-actions"><button class="btn-sm btn-invest" data-act="invest" data-id="'+p.id+'">立即投资</button></div>';
    }
    el.innerHTML='<div class="item-row"><div class="item-main"><div class="item-name">'+esc(p.name)+'</div><div class="item-tags"><span class="tag tag-industry">'+esc(p.industry)+'</span><span class="tag risk-'+lvl+'">'+esc(p.riskLabel)+'</span></div></div><div class="item-rate"><div class="rate-value pos">+'+fmt(p.currentRate,1)+'%</div><div class="rate-range">'+fmt(p.rateMin,1)+'% - '+fmt(p.rateMax,1)+'%</div></div></div>'+actions;
    listEl.appendChild(el);
  });
}
function invest(pId,amount){
  var u=GCU();if(!u)return{ok:false,msg:'登录已失效'};
  var p=u.projects.filter(function(x){return x.id===pId})[0];if(!p)return{ok:false,msg:'项目不存在'};
  amount=Math.round(Number(amount)*100)/100;
  if(isNaN(amount)||amount<=0)return{ok:false,msg:'请输入有效的投资金额'};
  if(amount>u.balance)return{ok:false,msg:'可用余额不足'};
  u.balance=Math.round((u.balance-amount)*100)/100;
  p.invested=Math.round((p.invested+amount)*100)/100;
  u.records.unshift({id:'r'+Date.now()+Math.random().toString(36).slice(2,7),date:nowStr(),title:'投资 · '+p.name,amount:-amount,invested:p.invested,profit:p.profit||0,balance:u.balance,projectId:p.id});
  SCU(u);return{ok:true};
}
function withdrawAll(pId){
  var u=GCU();if(!u)return{ok:false,msg:'登录已失效'};
  var p=u.projects.filter(function(x){return x.id===pId})[0];if(!p)return{ok:false,msg:'项目不存在'};
  if(p.invested<=0)return{ok:false,msg:'当前无持仓'};
  var total=Math.round(p.invested*100)/100;
  u.balance=Math.round((u.balance+total)*100)/100;
  u.records.unshift({id:'r'+Date.now()+Math.random().toString(36).slice(2,7),date:nowStr(),title:'撤资 · '+p.name,amount:total,invested:0,profit:0,balance:u.balance,projectId:p.id});
  p.invested=0;p.profit=0;
  SCU(u);return{ok:true,total:total};
}
listEl.addEventListener('click',function(e){
  var btn=e.target.closest('button[data-act]');if(!btn)return;
  var pId=btn.getAttribute('data-id'),act=btn.getAttribute('data-act');
  if(act==='invest'||act==='add'){
    var u=GCU();if(!u){window.location.href='index.html';return}
    var p=u.projects.filter(function(x){return x.id===pId})[0];
    showPrompt({
      title:act==='add'?'追加投资':'投资',
      desc:'项目：'+esc(p.name)+'<br>可用余额：'+fmt(u.balance)+' USDT',
      placeholder:'请输入金额',inputType:'number',confirmText:'确认',
      validate:function(v){var n=parseFloat(v);if(isNaN(n)||n<=0)return '请输入有效的金额';if(n>u.balance)return '可用余额不足';return null},
      onConfirm:function(v){var r=invest(pId,v);if(!r.ok){showAlert({title:'操作失败',desc:esc(r.msg)});return}render(GCU(),0,false)}
    });
  }else if(act==='withdraw'){
    var u2=GCU();if(!u2){window.location.href='index.html';return}
    var p2=u2.projects.filter(function(x){return x.id===pId})[0];
    var total=Math.round(p2.invested*100)/100,pr=p2.profit||0;
    var pc=pr>=0?'var(--pos)':'var(--neg)',ps=(pr>=0?'+':'')+fmt(pr);
    showConfirm({
      title:'确认撤资',
      desc:'项目：'+esc(p2.name)+'<br>当前本金：<strong style="color:var(--t)">'+fmt(total)+' USDT</strong><br>累计盈亏：<strong style="color:'+pc+'">'+ps+' USDT</strong><br><br>撤资后本息将返还到账户余额',
      confirmText:'确认撤资',
      onConfirm:function(){var r=withdrawAll(pId);if(!r.ok){showAlert({title:'操作失败',desc:esc(r.msg)});return}render(GCU(),0,false);showAlert({title:'撤资成功',desc:'已到账 <strong style="color:var(--pos)">'+fmt(r.total)+' USDT</strong>'})}
    });
  }
});
render(cu,0,false);
setInterval(function(){
  var u=GCU();if(!u){window.location.href='index.html';return}
  var res=settleOnce(u);SCU(u);
  var big=res.maxAbs>1;
  render(u,res.delta,big);
  if(res.hasInvest&&res.delta!==0)showFloat(res.delta,big);
},5000);
})();
</script>
