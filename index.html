<!-- ============================================================
     文件：index.html（登录）
     ============================================================ -->
<!DOCTYPE html>
<html lang="zh" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>空月平台 · 登录</title>
<script>(function(){try{var t=localStorage.getItem('kongyue_theme')||'dark';document.documentElement.setAttribute('data-theme',t)}catch(e){}})()</script>
<style>
:root{
  --bg1:#0b0f1a;--bg2:#141b2b;
  --card:rgba(18,25,40,.75);--card-solid:#121a28;--border:rgba(255,255,255,.06);
  --t:#eef4ff;--t2:#8fa3c9;--t3:#7f93b8;
  --input:rgba(8,14,24,.7);--input-bd:#253248;
  --accent:#5b8cff;--accent2:#3b66b0;
  --pos:#6ee7a0;--neg:#ff8a9a;
  --pos-bg:rgba(60,200,120,.1);--pos-bd:rgba(80,220,140,.25);
  --neg-bg:rgba(255,80,100,.1);--neg-bd:rgba(255,100,120,.25);
  --info-bg:rgba(91,140,255,.08);--info-bd:rgba(91,140,255,.25);
  --shadow:0 20px 50px -15px rgba(0,0,0,.8);
  --glow:rgba(80,140,255,.25);
  --ov:rgba(0,0,0,.7);
  --ease:cubic-bezier(.16,1,.3,1);
}
[data-theme="light"]{
  --bg1:#eef2f9;--bg2:#dbe4f2;
  --card:rgba(255,255,255,.82);--card-solid:#ffffff;--border:rgba(15,30,60,.08);
  --t:#17253d;--t2:#5a6b85;--t3:#7a8aa3;
  --input:rgba(240,244,250,.9);--input-bd:#cbd6e6;
  --accent:#3b66b0;--accent2:#2a4d8f;
  --pos:#199f4f;--neg:#d92b3a;
  --pos-bg:rgba(25,159,79,.1);--pos-bd:rgba(25,159,79,.22);
  --neg-bg:rgba(217,43,58,.08);--neg-bd:rgba(217,43,58,.22);
  --info-bg:rgba(59,102,176,.08);--info-bd:rgba(59,102,176,.22);
  --shadow:0 20px 50px -15px rgba(50,80,140,.25);
  --glow:rgba(90,140,220,.2);
  --ov:rgba(30,50,90,.35);
}
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif;-webkit-tap-highlight-color:transparent}
body{
  background:linear-gradient(145deg,var(--bg1) 0%,var(--bg2) 100%);
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.2rem;
  color:var(--t);transition:background .5s var(--ease),color .3s var(--ease);
  opacity:0;transform:translateY(6px);
  transition:opacity .45s var(--ease),transform .45s var(--ease),background .5s var(--ease),color .3s var(--ease);
}
body.page-loaded{opacity:1;transform:translateY(0)}
body.page-leaving{opacity:0;transform:translateY(-6px) scale(.99)}
body::before{content:'';position:fixed;top:-30%;left:-20%;width:70%;height:70%;
  background:radial-gradient(circle,var(--glow) 0%,transparent 65%);
  filter:blur(80px);pointer-events:none;z-index:0;opacity:.7;
  animation:floatA 22s ease-in-out infinite}
body::after{content:'';position:fixed;bottom:-30%;right:-20%;width:60%;height:60%;
  background:radial-gradient(circle,var(--glow) 0%,transparent 65%);
  filter:blur(90px);pointer-events:none;z-index:0;opacity:.5;
  animation:floatA 28s ease-in-out infinite reverse}
@keyframes floatA{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(60px,-40px) scale(1.12)}}

.card{
  position:relative;z-index:1;
  background:var(--card);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-radius:32px;box-shadow:var(--shadow),inset 0 1px 2px rgba(255,255,255,.06);
  width:100%;max-width:400px;padding:2rem 1.8rem 1.8rem;
  border:1px solid var(--border);
  transition:background .5s var(--ease),box-shadow .4s var(--ease),border-color .3s var(--ease),transform .4s var(--ease);
  animation:cardIn .8s var(--ease) both;
}
@keyframes cardIn{from{opacity:0;transform:translateY(30px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.card:hover{box-shadow:0 28px 60px -15px rgba(0,0,0,.5),0 0 0 1px rgba(120,160,255,.15),inset 0 1px 2px rgba(255,255,255,.06)}

.theme-btn{
  position:absolute;top:1rem;right:1rem;
  width:38px;height:38px;border-radius:50%;
  background:var(--input);border:1px solid var(--border);
  color:var(--t2);cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .35s var(--ease);
}
.theme-btn:hover{color:var(--accent);border-color:var(--accent);transform:rotate(20deg) scale(1.08)}
.theme-btn:active{transform:rotate(20deg) scale(.94)}
.theme-btn svg{width:16px;height:16px}
[data-theme="dark"] .i-sun{display:block}
[data-theme="dark"] .i-moon{display:none}
[data-theme="light"] .i-sun{display:none}
[data-theme="light"] .i-moon{display:block}

h1{font-size:1.9rem;font-weight:600;letter-spacing:-.02em;color:var(--t);margin-bottom:.15rem;text-shadow:0 4px 20px var(--glow);text-align:center;animation:upIn .8s .1s var(--ease) both}
h1 span{font-size:1.3rem;opacity:.6;font-weight:300}
.sub{color:var(--t2);font-size:.85rem;margin-bottom:1.6rem;letter-spacing:.3px;text-transform:uppercase;text-align:center;animation:upIn .8s .15s var(--ease) both}
@keyframes upIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}

.field{margin-bottom:1.05rem;animation:upIn .8s var(--ease) both}
.field:nth-of-type(1){animation-delay:.2s}
.field:nth-of-type(2){animation-delay:.25s}
label{display:block;font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--t2);margin-bottom:.35rem}
.wrap{display:flex;align-items:center;background:var(--input);border-radius:30px;padding:0 1.1rem;
  border:1px solid var(--input-bd);transition:all .3s var(--ease);
  box-shadow:inset 0 3px 8px rgba(0,0,0,.15)}
.wrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--info-bg),inset 0 3px 8px rgba(0,0,0,.15);transform:translateY(-1px)}
.wrap .icon{font-size:1rem;margin-right:.6rem;opacity:.6;color:var(--accent);user-select:none}
input{width:100%;border:none;padding:.75rem 0;font-size:.9rem;background:transparent;outline:none;color:var(--t);font-family:inherit}
input::placeholder{color:var(--t3);font-size:.85rem}

.btn{
  position:relative;width:100%;border:none;
  background:linear-gradient(135deg,var(--accent2),var(--accent));
  color:#fff;font-weight:600;font-size:.95rem;padding:.9rem;border-radius:40px;
  cursor:pointer;transition:all .35s var(--ease);
  margin-top:.6rem;letter-spacing:1.2px;text-transform:uppercase;
  box-shadow:0 8px 20px -6px rgba(59,102,176,.5),inset 0 0 0 1px rgba(255,255,255,.15);
  overflow:hidden;font-family:inherit;
  animation:upIn .8s .3s var(--ease) both;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 28px -8px rgba(59,102,176,.7)}
.btn:active{transform:translateY(0) scale(.98)}
.btn::after{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;
  background:linear-gradient(120deg,transparent,rgba(255,255,255,.3),transparent);
  transform:skewX(-20deg);transition:left .7s var(--ease)}
.btn:hover::after{left:120%}

.msg{margin:1.1rem 0 .3rem;padding:.7rem 1rem;border-radius:30px;font-size:.8rem;font-weight:500;
  text-align:center;background:rgba(255,255,255,.03);color:var(--t2);
  min-height:2.8rem;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--border);transition:all .3s var(--ease);
  animation:upIn .8s .35s var(--ease) both}
.msg.info{background:var(--info-bg);border-color:var(--info-bd);color:var(--accent)}
.msg.error{background:var(--neg-bg);border-color:var(--neg-bd);color:var(--neg)}
.msg.success{background:var(--pos-bg);border-color:var(--pos-bd);color:var(--pos)}

.switch{text-align:center;font-size:.78rem;color:var(--t2);margin-top:1.1rem;letter-spacing:.3px;animation:upIn .8s .4s var(--ease) both}
.switch a{color:var(--accent);text-decoration:none;font-weight:600;margin-left:.3rem;transition:all .25s var(--ease);display:inline-block}
.switch a:hover{transform:translateX(3px)}
.existing{margin-bottom:1rem;padding:.6rem .9rem;border-radius:14px;
  background:var(--info-bg);border:1px solid var(--info-bd);color:var(--accent);
  font-size:.75rem;letter-spacing:.3px;line-height:1.6;text-align:center;
  animation:upIn .8s .18s var(--ease) both}
.existing .u{color:var(--t);font-weight:600}

.hidden{display:none!important}

/* 弹窗 */
.ov{position:fixed;inset:0;background:var(--ov);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  display:flex;align-items:center;justify-content:center;z-index:999;padding:1.2rem;animation:fadeIn .25s var(--ease)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--card-solid);border-radius:28px;padding:1.8rem 1.6rem 1.5rem;max-width:340px;width:100%;
  box-shadow:0 40px 80px -20px rgba(0,0,0,.7),0 0 0 1px var(--border);
  border:1px solid var(--border);animation:modalIn .4s var(--ease);position:relative}
@keyframes modalIn{from{opacity:0;transform:translateY(24px) scale(.94)}60%{transform:translateY(-2px) scale(1.01)}to{opacity:1;transform:translateY(0) scale(1)}}
.modal h2{font-size:1.2rem;color:var(--t);margin-bottom:.25rem;font-weight:600}
.modal .m-sub{color:var(--t2);font-size:.8rem;margin-bottom:1.3rem}
.track{position:relative;width:100%;height:46px;background:var(--input);border-radius:40px;overflow:hidden;
  border:1px solid var(--input-bd);user-select:none;touch-action:none;cursor:grab;
  box-shadow:inset 0 4px 8px rgba(0,0,0,.2);transition:border-color .3s var(--ease)}
.track:hover{border-color:var(--accent)}
.track:active{cursor:grabbing}
.track .bg{position:absolute;left:0;top:0;height:100%;width:0%;
  background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:40px;
  transition:width .05s linear;pointer-events:none;opacity:.9}
.track .thumb{position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:38px;height:38px;background:linear-gradient(145deg,var(--accent2),var(--accent));
  border-radius:50%;box-shadow:0 6px 14px rgba(0,0,0,.4);
  display:flex;align-items:center;justify-content:center;
  transition:left .05s linear,transform .25s var(--ease);pointer-events:none;
  border:1px solid rgba(255,255,255,.3)}
.track:hover .thumb{transform:translateY(-50%) scale(1.08)}
.track .thumb svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.cap-st{text-align:center;margin-top:.9rem;font-size:.75rem;color:var(--t3);min-height:1.4rem;transition:color .3s var(--ease)}
.cap-st.ok{color:var(--pos);font-weight:600}
.cap-st.err{color:var(--neg)}
.cap-acts{display:flex;gap:.6rem;margin-top:1.1rem}
.cap-acts button{flex:1;border:none;padding:.7rem;border-radius:30px;font-weight:600;font-size:.8rem;
  cursor:pointer;transition:all .3s var(--ease);letter-spacing:.6px;text-transform:uppercase;font-family:inherit}
.cap-ok{background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;
  box-shadow:0 6px 14px -4px rgba(59,102,176,.5),inset 0 0 0 1px rgba(255,255,255,.15)}
.cap-ok:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 10px 20px -6px rgba(59,102,176,.7)}
.cap-ok:disabled{opacity:.35;cursor:not-allowed;filter:grayscale(.5);box-shadow:none}
.cap-no{background:rgba(255,255,255,.04);color:var(--t2);border:1px solid var(--border)}
.cap-no:hover{background:rgba(255,255,255,.08);transform:translateY(-1px)}

@media(max-width:420px){
  .card{padding:1.6rem 1.3rem 1.4rem;border-radius:24px}
  h1{font-size:1.6rem}
}
</style>
</head>
<body>
<div class="card">
  <button class="theme-btn" onclick="toggleTheme()" aria-label="切换主题">
    <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
    <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  </button>
  <h1>空月 <span>·</span> 平台</h1>
  <div class="sub">登录账号</div>
  <div id="existing" class="existing hidden">已登录为 <span class="u" id="existingUser">—</span></div>
  <form id="loginForm" autocomplete="off" onsubmit="return false">
    <div class="field">
      <label for="loginUser">用户名</label>
      <div class="wrap">
        <span class="icon">&#9993;</span>
        <input type="text" id="loginUser" placeholder="请输入用户名">
      </div>
    </div>
    <div class="field">
      <label for="loginPass">密码</label>
      <div class="wrap">
        <span class="icon">&#128274;</span>
        <input type="password" id="loginPass" placeholder="••••••••">
      </div>
    </div>
    <button type="submit" class="btn" id="loginBtn">登 录</button>
  </form>
  <div id="messageBox" class="msg info">请输入账号密码后登录</div>
  <div class="switch">还没有账号？<a href="register.html">立即注册 →</a></div>
</div>

<div id="captchaOverlay" class="ov hidden">
  <div class="modal">
    <h2>安全验证</h2>
    <div class="m-sub">请拖动滑块完成验证</div>
    <div class="track" id="captchaTrack">
      <div class="bg" id="captchaBg"></div>
      <div class="thumb" id="captchaThumb"><svg viewBox="0 0 24 24"><path d="M5 12l4 4L19 6"/></svg></div>
    </div>
    <div class="cap-st" id="captchaStatus">拖动滑块到右侧</div>
    <div class="cap-acts">
      <button type="button" class="cap-no" id="captchaCancelBtn">取消</button>
      <button type="button" class="cap-ok" id="captchaConfirmBtn" disabled>确认</button>
    </div>
  </div>
</div>

<script>
window.toggleTheme=function(){
  var cur=document.documentElement.getAttribute('data-theme');
  var nxt=cur==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',nxt);
  try{localStorage.setItem('kongyue_theme',nxt)}catch(e){}
};
document.addEventListener('DOMContentLoaded',function(){document.body.classList.add('page-loaded')});
document.addEventListener('click',function(e){
  var a=e.target.closest('a[href$=".html"]');
  if(!a||a.target==='_blank')return;
  e.preventDefault();
  document.body.classList.add('page-leaving');
  setTimeout(function(){window.location.href=a.href},220);
});
(function(){
"use strict";
var UK='kongyue_users_v1',SK='kongyue_session_v1';
function LU(){try{var r=localStorage.getItem(UK);return r?JSON.parse(r):{}}catch(e){return{}}}
function GS(){try{return localStorage.getItem(SK)||null}catch(e){return null}}
function SS(u){try{localStorage.setItem(SK,u)}catch(e){}}

var f=document.getElementById('loginForm'),u=document.getElementById('loginUser'),p=document.getElementById('loginPass'),
m=document.getElementById('messageBox'),ex=document.getElementById('existing'),exu=document.getElementById('existingUser'),
co=document.getElementById('captchaOverlay'),ct=document.getElementById('captchaTrack'),
cb=document.getElementById('captchaBg'),cth=document.getElementById('captchaThumb'),cs=document.getElementById('captchaStatus'),
cc=document.getElementById('captchaConfirmBtn'),cx=document.getElementById('captchaCancelBtn');

function SM(t,type){m.textContent=t;m.className='msg'+(type?' '+type:'')}

var s=GS();
if(s){var us=LU();if(us[s]){exu.textContent=us[s].nickname||s;ex.classList.remove('hidden')}}

var resolved=false,dragging=false,cx2=0,TW=38,PAD=5;
function reset(){resolved=false;dragging=false;cx2=0;cb.style.width='0%';cth.style.left=PAD+'px';cs.textContent='拖动滑块到右侧';cs.className='cap-st';cc.disabled=true}
function start(e){if(resolved)return;e.preventDefault();dragging=true}
function move(e){if(!dragging||resolved)return;e.preventDefault();
  var cl=e.type==='touchmove'?e.touches[0].clientX:e.clientX;
  var r=ct.getBoundingClientRect();var mx=r.width-TW-PAD*2;
  var x=cl-r.left-TW/2;x=Math.max(PAD,Math.min(x,mx+PAD));
  var pc=(x-PAD)/mx*100;cb.style.width=pc+'%';cth.style.left=x+'px';cx2=x}
function end(){if(!dragging)return;dragging=false;
  var r=ct.getBoundingClientRect();var mx=r.width-TW-PAD*2;
  if(cx2>=mx*0.92+PAD){resolved=true;cb.style.width='100%';cth.style.left=(mx+PAD)+'px';
    cs.textContent='验证通过';cs.className='cap-st ok';cc.disabled=false}
  else{if(cx2>PAD+10){cs.textContent='请将滑块拖到最右侧';cs.className='cap-st err';setTimeout(reset,600)}else reset();
    cb.style.width='0%';cth.style.left=PAD+'px';cx2=0}}
ct.addEventListener('mousedown',start);document.addEventListener('mousemove',move);document.addEventListener('mouseup',end);
ct.addEventListener('touchstart',start,{passive:false});document.addEventListener('touchmove',move,{passive:false});document.addEventListener('touchend',end,{passive:false});
cx.addEventListener('click',function(){co.classList.add('hidden');reset()});
co.addEventListener('click',function(e){if(e.target===this){co.classList.add('hidden');reset()}});

var pending=null;
f.addEventListener('submit',function(e){
  e.preventDefault();
  var uu=u.value.trim(),pp=p.value.trim();
  if(!uu){SM('请输入用户名','error');u.focus();return}
  if(!pp){SM('请输入密码','error');p.focus();return}
  var users=LU();
  if(!users[uu]){SM('账号不存在，请先注册','error');u.focus();return}
  if(users[uu].password!==pp){SM('密码错误，请重试','error');p.focus();return}
  pending=uu;SM('正在进行安全验证…');co.classList.remove('hidden');reset();
});
cc.addEventListener('click',function(){
  if(!resolved||!pending)return;
  co.classList.add('hidden');reset();
  SS(pending);SM('登录成功，正在进入…','success');
  document.body.classList.add('page-leaving');
  setTimeout(function(){window.location.href='home.html'},400);
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!co.classList.contains('hidden')){co.classList.add('hidden');reset();SM('已取消验证')}});
})();
</script>
</body>
</html>
