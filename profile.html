<!DOCTYPE html>
<html lang="zh" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>空月平台 · 个人</title>
<script>(function(){try{var t=localStorage.getItem('kongyue_theme')||'dark';document.documentElement.setAttribute('data-theme',t)}catch(e){}})()</script>
<style>
:root{
  --bg1:#0b0f1a;--bg2:#141b2b;
  --card:rgba(18,25,40,.75);--card-solid:#121a28;--card-h:rgba(24,33,52,.9);
  --border:rgba(255,255,255,.06);--border-h:rgba(120,160,255,.25);
  --t:#eef4ff;--t2:#8fa3c9;--t3:#7f93b8;
  --input:rgba(8,14,24,.7);--input-bd:#253248;
  --nav-bg:rgba(18,25,40,.85);
  --accent:#5b8cff;--accent2:#3b66b0;--accent-soft:rgba(91,140,255,.1);
  --pos:#6ee7a0;--neg:#ff8a9a;
  --pos-bg:rgba(60,200,120,.1);--pos-bd:rgba(80,220,140,.25);
  --neg-bg:rgba(255,80,100,.1);--neg-bd:rgba(255,100,120,.25);
  --info-bg:rgba(91,140,255,.08);--info-bd:rgba(91,140,255,.25);
  --shadow-sm:0 10px 28px -16px rgba(0,0,0,.9);
  --shadow-md:0 20px 50px -15px rgba(0,0,0,.8);
  --glow:rgba(80,140,255,.25);
  --ov:rgba(0,0,0,.7);
  --ease:cubic-bezier(.16,1,.3,1);
}
[data-theme="light"]{
  --bg1:#eef2f9;--bg2:#dbe4f2;
  --card:rgba(255,255,255,.82);--card-solid:#ffffff;--card-h:rgba(250,252,255,.95);
  --border:rgba(15,30,60,.08);--border-h:rgba(59,102,176,.25);
  --t:#17253d;--t2:#5a6b85;--t3:#7a8aa3;
  --input:rgba(240,244,250,.9);--input-bd:#cbd6e6;
  --nav-bg:rgba(255,255,255,.82);
  --accent:#3b66b0;--accent2:#2a4d8f;--accent-soft:rgba(59,102,176,.1);
  --pos:#199f4f;--neg:#d92b3a;
  --pos-bg:rgba(25,159,79,.1);--pos-bd:rgba(25,159,79,.22);
  --neg-bg:rgba(217,43,58,.08);--neg-bd:rgba(217,43,58,.22);
  --info-bg:rgba(59,102,176,.08);--info-bd:rgba(59,102,176,.22);
  --shadow-sm:0 10px 28px -16px rgba(50,80,140,.25);
  --shadow-md:0 20px 50px -15px rgba(50,80,140,.25);
  --glow:rgba(90,140,220,.2);
  --ov:rgba(30,50,90,.35);
}
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif;-webkit-tap-highlight-color:transparent}
body{background:linear-gradient(145deg,var(--bg1) 0%,var(--bg2) 100%);min-height:100vh;color:var(--t);padding-bottom:2.5rem;position:relative;overflow-x:hidden;
  opacity:0;transform:translateY(6px);
  transition:opacity .45s var(--ease),transform .45s var(--ease),background .5s var(--ease),color .3s var(--ease)}
body.page-loaded{opacity:1;transform:translateY(0)}
body.page-leaving{opacity:0;transform:translateY(-6px) scale(.99)}
body::before{content:'';position:fixed;top:-30%;left:-20%;width:70%;height:70%;background:radial-gradient(circle,var(--glow) 0%,transparent 65%);filter:blur(80px);pointer-events:none;z-index:0;opacity:.6;animation:floatA 24s ease-in-out infinite}
@keyframes floatA{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(70px,-50px) scale(1.12)}}

.navbar{position:sticky;top:0;z-index:100;background:var(--nav-bg);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:.85rem 1.1rem;box-shadow:0 8px 24px -12px rgba(0,0,0,.35);transition:background .5s var(--ease),border-color .3s var(--ease)}
.nav-inner{max-width:960px;margin:0 auto;width:100%;display:flex;align-items:center;justify-content:space-between;gap:1rem}
.brand{font-size:1.05rem;font-weight:600;letter-spacing:.02em;color:var(--t);white-space:nowrap;display:flex;align-items:center;gap:8px}
.brand::before{content:'';width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 0 12px var(--accent-soft);transition:transform .5s var(--ease)}
.brand:hover::before{transform:rotate(180deg) scale(1.1)}
.brand span{color:var(--accent);font-weight:300}
.nav-links{display:flex;gap:.25rem;align-items:center}
.nav-link{text-decoration:none;color:var(--t2);font-size:.82rem;font-weight:500;padding:.45rem .9rem;border-radius:20px;transition:all .3s var(--ease);letter-spacing:.3px;white-space:nowrap}
.nav-link:hover{color:var(--t);background:rgba(127,127,127,.08);transform:translateY(-1px)}
.nav-link.active{color:#fff;background:linear-gradient(135deg,var(--accent2),var(--accent));box-shadow:0 4px 12px -4px rgba(59,102,176,.6),inset 0 0 0 1px rgba(255,255,255,.15)}
.theme-btn{width:34px;height:34px;border-radius:50%;background:var(--input);border:1px solid var(--border);color:var(--t2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .35s var(--ease);flex-shrink:0;margin-left:.4rem}
.theme-btn:hover{color:var(--accent);border-color:var(--accent);transform:rotate(20deg) scale(1.08)}
.theme-btn svg{width:15px;height:15px}
[data-theme="dark"] .i-sun{display:block}[data-theme="dark"] .i-moon{display:none}
[data-theme="light"] .i-sun{display:none}[data-theme="light"] .i-moon{display:block}

.container{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:1.4rem 1.1rem 0}
.page-title{font-size:1.35rem;font-weight:600;letter-spacing:-.01em;margin-bottom:1.1rem;animation:upIn .7s .05s var(--ease) both}
@keyframes upIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}

.profile-card{position:relative;background:var(--card);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-radius:26px;padding:1.5rem 1.4rem;border:1.5px solid var(--border);
  box-shadow:var(--shadow-sm);display:flex;align-items:center;gap:1.2rem;
  margin-bottom:1.3rem;transition:all .4s var(--ease);overflow:hidden;
  animation:cardIn .7s .1s var(--ease) both}
.profile-card::before{content:'';position:absolute;top:-50%;right:-20%;width:60%;height:200%;background:radial-gradient(circle,var(--accent-soft) 0%,transparent 60%);pointer-events:none;opacity:.6}
.profile-card:hover{transform:translateY(-4px);border-color:var(--border-h);box-shadow:var(--shadow-md)}
@keyframes cardIn{from{opacity:0;transform:translateY(28px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.avatar{width:70px;height:70px;border-radius:50%;object-fit:cover;
  border:2px solid var(--border-h);
  box-shadow:0 6px 18px -6px rgba(0,0,0,.5),0 0 0 4px var(--accent-soft);
  background:var(--input);flex-shrink:0;position:relative;z-index:1;
  transition:transform .5s var(--ease),border-color .4s var(--ease)}
.profile-card:hover .avatar{transform:scale(1.05) rotate(-4deg);border-color:var(--accent)}
.profile-info{flex:1;min-width:0;position:relative;z-index:1}
.profile-nick{font-size:1.15rem;font-weight:600;color:var(--t);margin-bottom:.25rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.profile-uname{font-size:.68rem;color:var(--t3);letter-spacing:.4px;margin-bottom:.6rem;font-family:ui-monospace,Menlo,Consolas,monospace}
.profile-label{font-size:.66rem;color:var(--t2);text-transform:uppercase;letter-spacing:1.1px;margin-bottom:.25rem;font-weight:600}
.profile-balance{font-size:1.4rem;font-weight:700;color:var(--pos);letter-spacing:.3px;font-variant-numeric:tabular-nums}

.stat-row{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin-bottom:1.4rem;animation:cardIn .7s .2s var(--ease) both}
.stat-box{background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1.5px solid var(--border);border-radius:18px;padding:.95rem .9rem;text-align:center;
  box-shadow:var(--shadow-sm);transition:all .4s var(--ease)}
.stat-box:hover{transform:translateY(-3px);border-color:var(--border-h);box-shadow:var(--shadow-md)}
.stat-label{font-size:.62rem;color:var(--t2);letter-spacing:1px;text-transform:uppercase;margin-bottom:.35rem;font-weight:600}
.stat-value{font-size:1.05rem;font-weight:700;font-variant-numeric:tabular-nums}
.stat-value.pos{color:var(--pos)}
.stat-value.neg{color:var(--neg)}

.section-label{font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:1.1px;color:var(--t2);margin:0 0 .8rem .35rem;animation:upIn .7s .25s var(--ease) both}
.list{display:flex;flex-direction:column;gap:.7rem}
.card-item{position:relative;background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1.5px solid var(--border);border-radius:20px;padding:1rem 1.2rem;
  box-shadow:var(--shadow-sm);transition:all .4s var(--ease);
  display:flex;align-items:center;justify-content:space-between;gap:1rem;
  text-decoration:none;color:inherit;cursor:pointer;overflow:hidden;
  animation:cardIn .55s var(--ease) both}
.card-item::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--accent),var(--accent2));transform:scaleY(0);transition:transform .4s var(--ease)}
.card-item:hover{transform:translateX(6px);border-color:var(--border-h);box-shadow:var(--shadow-md);background:var(--card-h)}
.card-item:hover::before{transform:scaleY(1)}
.item-left{display:flex;align-items:center;gap:.9rem;flex:1;min-width:0}
.opt-icon{width:40px;height:40px;border-radius:12px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(145deg,var(--accent2),var(--accent));
  border:1px solid rgba(255,255,255,.1);
  box-shadow:0 6px 14px -6px rgba(59,102,176,.6);
  transition:transform .4s var(--ease)}
.opt-icon svg{width:18px;height:18px;stroke:#fff}
.card-item:hover .opt-icon{transform:scale(1.08) rotate(-6deg)}
.item-name{font-size:.94rem;font-weight:600;color:var(--t);letter-spacing:.2px}
.item-meta{font-size:.68rem;color:var(--t3);margin-top:.22rem;letter-spacing:.3px}
.arrow{color:var(--t3);font-size:1.1rem;transition:all .4s var(--ease);flex-shrink:0}
.card-item:hover .arrow{color:var(--accent);transform:translateX(4px)}

.ov{position:fixed;inset:0;background:var(--ov);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;z-index:900;padding:1.2rem;animation:fadeIn .25s var(--ease)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--card-solid);border-radius:28px;padding:1.6rem 1.5rem 1.4rem;max-width:400px;width:100%;box-shadow:0 40px 80px -20px rgba(0,0,0,.7);border:1px solid var(--border);animation:modalIn .4s var(--ease)}
@keyframes modalIn{from{opacity:0;transform:translateY(28px) scale(.94)}60%{transform:translateY(-2px) scale(1.01)}to{opacity:1;transform:translateY(0) scale(1)}}
.modal h3{font-size:1.1rem;color:var(--t);margin-bottom:.4rem;font-weight:600}
.modal-desc{font-size:.82rem;color:var(--t2);line-height:1.7;margin-bottom:1.1rem}
.modal-input{width:100%;background:var(--input);border:1.5px solid var(--input-bd);border-radius:30px;padding:.8rem 1.1rem;color:var(--t);font-size:.9rem;outline:none;font-family:inherit;margin-bottom:.5rem;transition:all .3s var(--ease)}
.modal-input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--info-bg)}
.modal-hint{font-size:.68rem;color:var(--t3);margin-bottom:.9rem;letter-spacing:.3px;padding-left:.3rem;min-height:.9rem}
.modal-hint.warn{color:var(--neg)}
.modal-actions{display:flex;gap:.6rem;margin-top:.4rem}
.modal-actions button{flex:1;border:none;padding:.8rem;border-radius:30px;font-weight:600;font-size:.85rem;cursor:pointer;transition:all .3s var(--ease);letter-spacing:.5px;font-family:inherit}
.modal-btn-primary{background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;box-shadow:0 6px 14px -4px rgba(59,102,176,.5),inset 0 0 0 1px rgba(255,255,255,.15)}
.modal-btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 20px -6px rgba(59,102,176,.7)}
.modal-btn-ghost{background:rgba(127,127,127,.08);color:var(--t2);border:1px solid var(--border)}
.modal-btn-ghost:hover{background:rgba(127,127,127,.15);color:var(--t)}

@media(min-width:760px){
  .container{padding:1.8rem 1.5rem 0}
  .navbar{padding:.95rem 1.5rem}
  .brand{font-size:1.15rem}
  .nav-link{font-size:.85rem;padding:.5rem 1.1rem}
}
@media(max-width:420px){
  .navbar{padding:.75rem .9rem}
  .brand{font-size:.95rem}
  .brand::before{width:16px;height:16px}
  .nav-link{padding:.4rem .7rem;font-size:.76rem}
  .container{padding:1.1rem .9rem 0}
  .page-title{font-size:1.2rem}
  .profile-card{padding:1.2rem 1.1rem;border-radius:22px;gap:.95rem}
  .avatar{width:58px;height:58px}
  .profile-nick{font-size:1rem}
  .profile-balance{font-size:1.2rem}
  .card-item{padding:.9rem 1rem;border-radius:18px}
  .card-item:hover{transform:none}
}
</style>
</head>
<body>
<nav class="navbar">
  <div class="nav-inner">
    <div class="brand">空月 <span>·</span> 平台</div>
    <div class="nav-links">
      <a href="home.html" class="nav-link">主页</a>
      <a href="records.html" class="nav-link">记录</a>
      <a href="profile.html" class="nav-link active">个人</a>
      <button class="theme-btn" onclick="toggleTheme()" aria-label="切换主题">
        <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </div>
</nav>

<main class="container">
  <div class="page-title">个人中心</div>
  <div class="profile-card">
    <img id="avatarImg" class="avatar" alt="头像">
    <div class="profile-info">
      <div class="profile-nick" id="nickName">—</div>
      <div class="profile-uname" id="unameText">@—</div>
      <div class="profile-label">账户余额</div>
      <div class="profile-balance" id="balanceText">— USDT</div>
    </div>
  </div>
  <div class="stat-row">
    <div class="stat-box"><div class="stat-label">累计收益</div><div class="stat-value pos" id="statProfit">+0.00</div></div>
    <div class="stat-box"><div class="stat-label">累计亏损</div><div class="stat-value neg" id="statLoss">-0.00</div></div>
  </div>
  <div class="section-label">账户管理</div>
  <div id="optionList" class="list"></div>
</main>

<div id="modalRoot"></div>

<script>
window.toggleTheme=function(){var c=document.documentElement.getAttribute('data-theme');var n=c==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);try{localStorage.setItem('kongyue_theme',n)}catch(e){}};
document.addEventListener('DOMContentLoaded',function(){document.body.classList.add('page-loaded')});
document.addEventListener('click',function(e){var a=e.target.closest('a[href$=".html"]');if(!a||a.target==='_blank')return;e.preventDefault();document.body.classList.add('page-leaving');setTimeout(function(){window.location.href=a.href},220)});
(function(){
"use strict";
var UK='kongyue_users_v1',SK='kongyue_session_v1';
var OPTS=[
  {id:'withdraw',label:'账户提现',desc:'将账户余额提取至钱包地址',href:'#',icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v14M19 9l-7 7-7-7M5 21h14"/></svg>'},
  {id:'risk',label:'风险评估',desc:'查看当前账户风险等级',href:'#',icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M18 17V9M13 17V5M8 17v-3"/></svg>'},
  {id:'privacy',label:'账户设置',desc:'修改昵称、注销账号',href:'privacy.html',icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="12" cy="10" r="3"/><path d="M6 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/></svg>'}
];
var FA='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b8cff"/><stop offset="1" stop-color="#3b66b0"/></linearGradient></defs><rect width="100" height="100" fill="url(#g)"/><circle cx="50" cy="40" r="16" fill="#fff" opacity=".92"/><path d="M18 92c0-18 14-28 32-28s32 10 32 28z" fill="#fff" opacity=".92"/></svg>');
function LU(){try{var r=localStorage.getItem(UK);return r?JSON.parse(r):{}}catch(e){return{}}}
function SU(u){try{localStorage.setItem(UK,JSON.stringify(u))}catch(e){}}
function GS(){try{return localStorage.getItem(SK)||null}catch(e){return null}}
function GCU(){var s=GS();if(!s)return null;var u=LU();return u[s]||null}
if(!GCU()){window.location.href='index.html';return}
var avatarImg=document.getElementById('avatarImg'),nickName=document.getElementById('nickName'),unameText=document.getElementById('unameText'),balanceText=document.getElementById('balanceText'),statProfit=document.getElementById('statProfit'),statLoss=document.getElementById('statLoss'),optionList=document.getElementById('optionList'),modalRoot=document.getElementById('modalRoot');
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function fmt(n,d){return Number(n).toFixed(d===undefined?2:d)}
function nowStr(){var d=new Date(),p=function(n){return String(n).padStart(2,'0')};return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds())}
function showAlert(o){
  var ov=document.createElement('div');ov.className='ov';
  ov.innerHTML='<div class="modal"><h3>'+esc(o.title||'提示')+'</h3>'+(o.desc?'<div class="modal-desc">'+o.desc+'</div>':'')+'<div class="modal-actions"><button class="modal-btn-primary" data-act="ok">'+esc(o.confirmText||'确定')+'</button></div></div>';
  modalRoot.appendChild(ov);
  var ok=ov.querySelector('[data-act="ok"]');
  function close(){ov.style.opacity='0';ov.style.transition='opacity .2s';setTimeout(function(){ov.remove();if(o.onConfirm)o.onConfirm()},180)}
  ok.addEventListener('click',close);ov.addEventListener('click',function(e){if(e.target===ov)close()});
}
function showPrompt(o){
  var ov=document.createElement('div');ov.className='ov';
  ov.innerHTML='<div class="modal"><h3>'+esc(o.title||'请输入')+'</h3>'+(o.desc?'<div class="modal-desc">'+o.desc+'</div>':'')+'<input class="modal-input" type="'+(o.inputType||'text')+'" placeholder="'+esc(o.placeholder||'')+'"><div class="modal-hint" data-hint>'+(o.hint||'')+'</div><div class="modal-actions"><button class="modal-btn-ghost" data-act="cancel">取消</button><button class="modal-btn-primary" data-act="ok">'+esc(o.confirmText||'确定')+'</button></div></div>';
  modalRoot.appendChild(ov);
  var input=ov.querySelector('.modal-input'),hint=ov.querySelector('[data-hint]');
  function close(){ov.style.opacity='0';ov.style.transition='opacity .2s';setTimeout(function(){ov.remove()},180)}
  ov.querySelector('[data-act="cancel"]').addEventListener('click',close);
  ov.querySelector('[data-act="ok"]').addEventListener('click',function(){
    var v=input.value;
    if(o.validate){var err=o.validate(v);if(err){hint.textContent=err;hint.classList.add('warn');input.focus();return}}
    close();if(o.onConfirm)setTimeout(function(){o.onConfirm(v)},180);
  });
  ov.addEventListener('click',function(e){if(e.target===ov)close()});
  setTimeout(function(){input.focus()},80);
  input.addEventListener('keydown',function(e){if(e.key==='Enter')ov.querySelector('[data-act="ok"]').click()});
}
function render(){
  var u=GCU();if(!u){window.location.href='index.html';return}
  nickName.textContent=u.nickname||u.username;
  unameText.textContent='@'+u.username;
  balanceText.textContent=fmt(u.balance)+' USDT';
  var profit=u.stats.totalProfit||0,loss=u.stats.totalLoss||0;
  statProfit.textContent='+'+fmt(profit);
  statLoss.textContent='-'+fmt(loss);
  avatarImg.onerror=function(){this.onerror=null;this.src=FA};
  avatarImg.src=u.avatar||'img/avatar.png';
  optionList.innerHTML='';
  OPTS.forEach(function(o,i){
    var a=document.createElement('a');
    a.className='card-item';a.href=o.href;a.style.animationDelay=(0.25+i*0.07)+'s';
    a.innerHTML='<div class="item-left"><div class="opt-icon">'+o.icon+'</div><div><div class="item-name">'+esc(o.label)+'</div><div class="item-meta">'+esc(o.desc)+'</div></div></div><div class="arrow">›</div>';
    if(o.id==='withdraw'){
      a.addEventListener('click',function(e){
        e.preventDefault();
        var uu=GCU();if(!uu)return;
        showPrompt({
          title:'账户提现',
          desc:'可用余额：<strong style="color:var(--pos)">'+fmt(uu.balance)+' USDT</strong>',
          placeholder:'请输入提现金额',inputType:'number',
          validate:function(v){var n=parseFloat(v);if(isNaN(n)||n<=0)return '请输入有效的金额';if(n>uu.balance)return '可用余额不足';return null},
          onConfirm:function(v){
            var amt=Math.round(parseFloat(v)*100)/100;
            var u2=GCU();if(!u2)return;
            u2.balance=Math.round((u2.balance-amt)*100)/100;
            u2.records.unshift({id:'r'+Date.now()+Math.random().toString(36).slice(2,7),date:nowStr(),title:'账户提现',amount:-amt,balance:u2.balance});
            var users=LU();users[u2.username]=u2;SU(users);
            render();
            showAlert({title:'提现申请已提交',desc:'金额：<strong style="color:var(--pos)">'+fmt(amt)+' USDT</strong><br>预计 24 小时内到账'});
          }
        });
      });
    }else if(o.id==='risk'){
      a.addEventListener('click',function(e){
        e.preventDefault();
        var uu=GCU();if(!uu)return;
        var lines=uu.projects.filter(function(p){return p.invested>0}).map(function(p){return '<div style="margin-bottom:.35rem">· '+esc(p.name)+'（'+esc(p.riskLabel)+'）</div>'});
        if(!lines.length)showAlert({title:'风险评估',desc:'当前无持仓项目。<br>风险等级会随市场波动而调整，请谨慎投资。'});
        else showAlert({title:'持仓风险评估',desc:lines.join('')+'<div style="margin-top:.6rem;color:var(--t3);font-size:.72rem">风险等级会随市场波动而调整</div>'});
      });
    }
    optionList.appendChild(a);
  });
}
render();
document.addEventListener('visibilitychange',function(){if(!document.hidden)render()});
})();
</script>
</body>
</html>
