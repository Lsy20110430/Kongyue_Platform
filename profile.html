     文件：profile.html（个人）
     ============================================================ -->
<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>空月平台 · 个人</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif; }
    body { background: linear-gradient(145deg,#0b0f1a 0%,#141b2b 100%); min-height:100vh; color:#eef4ff; padding-bottom:2.5rem; }
    .navbar {
      position: sticky; top:0; z-index:100;
      background: rgba(18,25,40,.88); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255,255,255,.06); padding: .85rem 1.1rem;
      display:flex; align-items:center; justify-content:space-between; gap:1rem;
      box-shadow: 0 8px 24px -12px rgba(0,0,0,.8);
    }
    .nav-brand { font-size:1.05rem; font-weight:600; letter-spacing:.02em; color:#eef4ff; text-shadow:0 2px 12px rgba(80,140,255,.25); white-space:nowrap; }
    .nav-brand span { color:#5b8cff; font-weight:300; }
    .nav-links { display:flex; gap:.25rem; }
    .nav-link {
      text-decoration:none; color:#8fa3c9; font-size:.82rem; font-weight:500;
      padding:.45rem .9rem; border-radius:20px; transition:.22s; letter-spacing:.3px; white-space:nowrap;
    }
    .nav-link:hover { color:#c8d6f0; background:rgba(255,255,255,.05); }
    .nav-link.active { color:#e3ecff; background:linear-gradient(135deg,#2a4270,#1b2d4e);
      box-shadow: 0 4px 12px -4px rgba(0,0,0,.7), inset 0 0 0 1px rgba(120,160,255,.2); }
    .container { max-width:560px; margin:0 auto; padding:1.2rem 1.1rem 0; }
    .page-title { font-size:1.35rem; font-weight:600; letter-spacing:-.01em; margin-bottom:1.1rem; }

    .profile-card {
      background: rgba(18,25,40,.78); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-radius:26px; padding:1.4rem 1.3rem;
      border:1px solid rgba(255,255,255,.07);
      box-shadow: 0 20px 44px -20px rgba(0,0,0,.95), inset 0 1px 2px rgba(255,255,255,.05);
      display:flex; align-items:center; gap:1.15rem; margin-bottom:1.2rem;
    }
    .avatar {
      width:66px; height:66px; border-radius:50%; object-fit:cover;
      border:2px solid rgba(91,140,255,.35);
      box-shadow: 0 6px 18px -6px rgba(0,0,0,.9), 0 0 0 4px rgba(91,140,255,.08);
      background:#0e1626; flex-shrink:0;
    }
    .profile-info { flex:1; min-width:0; }
    .profile-nick { font-size:1.1rem; font-weight:600; color:#eef4ff; letter-spacing:.2px; margin-bottom:.25rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .profile-uname { font-size:.68rem; color:#5d7298; letter-spacing:.4px; margin-bottom:.5rem; }
    .profile-label { font-size:.66rem; color:#7f93b8; text-transform:uppercase; letter-spacing:1.1px; margin-bottom:.2rem; }
    .profile-balance { font-size:1.3rem; font-weight:700; color:#8ce0ac; letter-spacing:.3px; text-shadow:0 0 16px rgba(60,200,120,.25); }

    .stat-row { display:grid; grid-template-columns:1fr 1fr; gap:.6rem; margin-bottom:1.4rem; }
    .stat-box {
      background:rgba(18,25,40,.7); border:1px solid rgba(255,255,255,.06);
      border-radius:16px; padding:.75rem .9rem; text-align:center;
    }
    .stat-label { font-size:.6rem; color:#7f93b8; letter-spacing:1px; text-transform:uppercase; margin-bottom:.3rem; }
    .stat-value { font-size:1rem; font-weight:700; }
    .stat-value.pos { color:#6ee7a0; }
    .stat-value.neg { color:#ff8a9a; }

    .section-label { font-size:.7rem; font-weight:600; text-transform:uppercase; letter-spacing:1.1px; color:#7f93b8; margin:0 0 .7rem .35rem; }
    .list { display:flex; flex-direction:column; gap:.65rem; }
    .card-item {
      background: rgba(18,25,40,.72); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border-radius:20px; padding:.95rem 1.15rem;
      border:1px solid rgba(255,255,255,.06);
      box-shadow: 0 10px 28px -16px rgba(0,0,0,.9), inset 0 1px 2px rgba(255,255,255,.04);
      transition: transform .18s ease, box-shadow .25s ease, border-color .25s ease;
      display:flex; align-items:center; justify-content:space-between; gap:.9rem;
      text-decoration:none; color:inherit; cursor:pointer;
    }
    .card-item:hover { transform: translateY(-2px); border-color: rgba(120,160,255,.2);
      box-shadow: 0 16px 36px -16px rgba(0,0,0,.95), 0 0 0 1px rgba(120,160,255,.08); }
    .item-left { display:flex; align-items:center; gap:.85rem; flex:1; min-width:0; }
    .opt-icon {
      width:36px; height:36px; border-radius:12px; flex-shrink:0;
      display:flex; align-items:center; justify-content:center; font-size:1rem;
      background:linear-gradient(145deg,#1e2e4a,#15223a);
      border:1px solid rgba(120,160,255,.15);
    }
    .item-name { font-size:.92rem; font-weight:600; color:#eef4ff; letter-spacing:.2px; }
    .item-meta { font-size:.68rem; color:#7f93b8; margin-top:.22rem; letter-spacing:.3px; }
    .arrow { color:#5d7298; font-size:1rem; transition:.2s; flex-shrink:0; }
    .card-item:hover .arrow { color:#8fa3c9; transform:translateX(3px); }

    /* ========= 自定义弹窗通用 ========= */
    .modal-overlay {
      position:fixed; inset:0; background:rgba(0,0,0,.72); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
      display:flex; align-items:center; justify-content:center; z-index:900;
      animation:fadeIn .18s ease; padding:1.2rem;
    }
    @keyframes fadeIn { from{opacity:0} to{opacity:1} }
    .modal {
      background:rgba(18,26,42,.96); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
      border-radius:24px; padding:1.5rem 1.4rem 1.3rem; max-width:340px; width:100%;
      box-shadow: 0 40px 80px -20px rgba(0,0,0,.9), 0 0 0 1px rgba(120,160,255,.1);
      border:1px solid rgba(255,255,255,.05);
      animation: slideUp .25s cubic-bezier(.16,1,.3,1);
    }
    @keyframes slideUp { from{transform:translateY(20px);opacity:0} to{transform:translateY(0);opacity:1} }
    .modal h3 { font-size:1.05rem; color:#eef4ff; margin-bottom:.5rem; font-weight:600; letter-spacing:-.01em; }
    .modal .modal-desc { font-size:.8rem; color:#8fa3c9; line-height:1.6; margin-bottom:1.1rem; letter-spacing:.2px; }
    .modal-input {
      width:100%; background:rgba(8,14,24,.7); border:1px solid #253248;
      border-radius:30px; padding:.75rem 1.1rem; color:#eef4ff; font-size:.9rem;
      outline:none; transition:.25s; font-family:inherit; margin-bottom:.6rem;
      box-shadow: inset 0 3px 8px rgba(0,0,0,.5);
    }
    .modal-input:focus { border-color:#5b8cff; box-shadow: 0 0 0 3px rgba(91,140,255,.15), inset 0 3px 8px rgba(0,0,0,.5); }
    .modal-input::placeholder { color:#475d82; }
    .modal-hint { font-size:.68rem; color:#6b7fa3; margin-bottom:1rem; letter-spacing:.3px; padding-left:.2rem; }
    .modal-hint.warn { color:#ff9aa9; }
    .modal-actions { display:flex; gap:.6rem; margin-top:.8rem; }
    .modal-actions button {
      flex:1; border:none; padding:.7rem; border-radius:30px; font-weight:600; font-size:.85rem;
      cursor:pointer; transition:.2s; letter-spacing:.6px; font-family:inherit;
    }
    .modal-btn-primary {
      background:linear-gradient(135deg,#2a4270,#1b2d4e); color:#e3ecff;
      box-shadow: 0 6px 14px -4px rgba(0,0,0,.6), inset 0 0 0 1px rgba(120,160,255,.15);
    }
    .modal-btn-primary:hover { background:linear-gradient(135deg,#345288,#223a5e); transform:scale(1.02); }
    .modal-btn-ghost { background:rgba(255,255,255,.04); color:#8fa3c9; border:1px solid rgba(255,255,255,.07); }
    .modal-btn-ghost:hover { background:rgba(255,255,255,.08); color:#b8c9e8; }

    @media (max-width:400px) {
      .nav-link { padding:.4rem .7rem; font-size:.76rem; }
      .page-title { font-size:1.2rem; }
      .avatar { width:58px; height:58px; }
      .profile-balance { font-size:1.15rem; }
    }
  </style>
</head>
<body>

<nav class="navbar">
  <div class="nav-brand">空月 <span>·</span> 平台</div>
  <div class="nav-links">
    <a href="home.html" class="nav-link">主页</a>
    <a href="records.html" class="nav-link">记录</a>
    <a href="profile.html" class="nav-link active">个人</a>
  </div>
</nav>

<div class="container">
  <div class="page-title">个人中心</div>

  <div class="profile-card">
    <img id="avatarImg" class="avatar" alt="用户头像" />
    <div class="profile-info">
      <div class="profile-nick" id="nickName">—</div>
      <div class="profile-uname" id="unameText">@—</div>
      <div class="profile-label">账户余额</div>
      <div class="profile-balance" id="balanceText">— USDT</div>
    </div>
  </div>

  <div class="stat-row">
    <div class="stat-box">
      <div class="stat-label">累计收益</div>
      <div class="stat-value pos" id="statProfit">+0.00</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">累计亏损</div>
      <div class="stat-value neg" id="statLoss">-0.00</div>
    </div>
  </div>

  <div class="section-label">账户管理</div>
  <div id="optionList" class="list"></div>
</div>

<div id="modalRoot"></div>

<script>
  (function () {
    "use strict";
    var USERS_KEY = 'kongyue_users_v1';
    var SESSION_KEY = 'kongyue_session_v1';

    var OPTIONS = [
      { id:'withdraw', label:'账户提现', desc:'将账户余额提取至钱包地址', icon:'💸', href:'#' },
      { id:'risk',     label:'风险评估', desc:'查看当前账户风险等级',     icon:'📊', href:'#' },
      { id:'privacy',  label:'账户设置', desc:'修改昵称等账户信息',       icon:'🔒', href:'privacy.html' }
    ];

    var FALLBACK_AVATAR = 'data:image/svg+xml;utf8,' + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">' +
      '<rect width="100" height="100" fill="#1b2942"/>' +
      '<circle cx="50" cy="38" r="16" fill="#3b66b0"/>' +
      '<path d="M18 92c0-18 14-28 32-28s32 10 32 28z" fill="#3b66b0"/>' +
      '</svg>'
    );

    function loadUsers() {
      try { var raw = localStorage.getItem(USERS_KEY); return raw ? JSON.parse(raw) : {}; }
      catch (e) { return {}; }
    }
    function saveUsers(u) {
      try { localStorage.setItem(USERS_KEY, JSON.stringify(u)); } catch (e) {}
    }
    function getSession() {
      try { return localStorage.getItem(SESSION_KEY) || null; } catch (e) { return null; }
    }
    function getCurrentUser() {
      var s = getSession(); if (!s) return null;
      var users = loadUsers(); return users[s] || null;
    }

    if (!getCurrentUser()) { window.location.href = 'index.html'; return; }

    var avatarImg = document.getElementById('avatarImg');
    var nickName = document.getElementById('nickName');
    var unameText = document.getElementById('unameText');
    var balanceText = document.getElementById('balanceText');
    var statProfit = document.getElementById('statProfit');
    var statLoss = document.getElementById('statLoss');
    var optionList = document.getElementById('optionList');
    var modalRoot = document.getElementById('modalRoot');

    function esc(s) {
      return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }
    function fmt(n, d) { return Number(n).toFixed(d === undefined ? 2 : d); }

    function nowStr() {
      var d = new Date();
      var p = function (n) { return String(n).padStart(2, '0'); };
      return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
    }

    /* ========= 弹窗 ========= */
    function showAlert(opts) {
      var ov = document.createElement('div');
      ov.className = 'modal-overlay';
      ov.innerHTML =
        '<div class="modal">' +
          '<h3>' + esc(opts.title || '提示') + '</h3>' +
          (opts.desc ? '<div class="modal-desc">' + opts.desc + '</div>' : '') +
          '<div class="modal-actions">' +
            '<button class="modal-btn-primary" data-act="ok">' + esc(opts.confirmText || '确定') + '</button>' +
          '</div>' +
        '</div>';
      modalRoot.appendChild(ov);
      var okBtn = ov.querySelector('[data-act="ok"]');
      function close() { ov.remove(); if (opts.onConfirm) opts.onConfirm(); }
      okBtn.addEventListener('click', close);
      ov.addEventListener('click', function (e) { if (e.target === ov) close(); });
      setTimeout(function () { okBtn.focus(); }, 50);
    }

    function showPrompt(opts) {
      var ov = document.createElement('div');
      ov.className = 'modal-overlay';
      ov.innerHTML =
        '<div class="modal">' +
          '<h3>' + esc(opts.title || '请输入') + '</h3>' +
          (opts.desc ? '<div class="modal-desc">' + opts.desc + '</div>' : '') +
          '<input class="modal-input" type="' + (opts.inputType || 'text') + '" placeholder="' + esc(opts.placeholder || '') + '" value="' + esc(opts.defaultValue || '') + '" />' +
          '<div class="modal-hint" data-hint>' + (opts.hint || '') + '</div>' +
          '<div class="modal-actions">' +
            '<button class="modal-btn-ghost" data-act="cancel">取消</button>' +
            '<button class="modal-btn-primary" data-act="ok">' + esc(opts.confirmText || '确定') + '</button>' +
          '</div>' +
        '</div>';
      modalRoot.appendChild(ov);
      var input = ov.querySelector('.modal-input');
      var hintEl = ov.querySelector('[data-hint]');
      function close() { ov.remove(); }
      ov.querySelector('[data-act="cancel"]').addEventListener('click', close);
      ov.querySelector('[data-act="ok"]').addEventListener('click', function () {
        var val = input.value;
        if (opts.validate) {
          var err = opts.validate(val);
          if (err) { hintEl.textContent = err; hintEl.classList.add('warn'); input.focus(); return; }
        }
        close();
        if (opts.onConfirm) opts.onConfirm(val);
      });
      ov.addEventListener('click', function (e) { if (e.target === ov) close(); });
      setTimeout(function () { input.focus(); input.select(); }, 50);
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') ov.querySelector('[data-act="ok"]').click();
      });
    }

    function render() {
      var user = getCurrentUser();
      if (!user) { window.location.href = 'index.html'; return; }

      nickName.textContent = user.nickname || user.username;
      unameText.textContent = '@' + user.username;
      balanceText.textContent = fmt(user.balance) + ' USDT';

      var profit = user.stats.totalProfit || 0;
      var loss = user.stats.totalLoss || 0;
      statProfit.textContent = '+' + fmt(profit);
      statLoss.textContent = '-' + fmt(loss);

      avatarImg.onerror = function () { this.onerror = null; this.src = FALLBACK_AVATAR; };
      avatarImg.src = user.avatar || 'img/avatar.png';

      optionList.innerHTML = '';
      OPTIONS.forEach(function (o) {
        var a = document.createElement('a');
        a.className = 'card-item';
        a.href = o.href;
        a.innerHTML =
          '<div class="item-left">' +
            '<div class="opt-icon">' + o.icon + '</div>' +
            '<div>' +
              '<div class="item-name">' + esc(o.label) + '</div>' +
              '<div class="item-meta">' + esc(o.desc) + '</div>' +
            '</div>' +
          '</div>' +
          '<div class="arrow">›</div>';

        if (o.id === 'withdraw') {
          a.addEventListener('click', function (e) {
            e.preventDefault();
            var u = getCurrentUser(); if (!u) return;
            showPrompt({
              title: '账户提现',
              desc: '可用余额：<strong style="color:#8ce0ac;">' + fmt(u.balance) + ' USDT</strong>',
              placeholder: '请输入提现金额',
              inputType: 'number',
              validate: function (v) {
                var n = parseFloat(v);
                if (isNaN(n) || n <= 0) return '请输入有效的金额';
                if (n > u.balance) return '可用余额不足';
                return null;
              },
              onConfirm: function (v) {
                var amt = Math.round(parseFloat(v) * 100) / 100;
                var u2 = getCurrentUser(); if (!u2) return;
                u2.balance = Math.round((u2.balance - amt) * 100) / 100;
                u2.records.unshift({
                  id: 'r' + Date.now() + Math.random().toString(36).slice(2, 7),
                  date: nowStr(), title: '账户提现', amount: -amt, balance: u2.balance
                });
                var users = loadUsers(); users[u2.username] = u2; saveUsers(users);
                render();
                showAlert({
                  title: '提现申请已提交',
                  desc: '金额：<strong style="color:#8ce0ac;">' + fmt(amt) + ' USDT</strong><br />预计 24 小时内到账'
                });
              }
            });
          });
        } else if (o.id === 'risk') {
          a.addEventListener('click', function (e) {
            e.preventDefault();
            var u = getCurrentUser(); if (!u) return;
            var lines = u.projects.filter(function (p) { return p.invested > 0; }).map(function (p) {
              return '<div style="margin-bottom:.35rem;">· ' + esc(p.name) + '（' + esc(p.riskLabel) + '）</div>';
            });
            if (!lines.length) {
              showAlert({ title: '风险评估', desc: '当前无持仓项目。<br />风险等级会随市场波动而调整，请谨慎投资。' });
            } else {
              showAlert({
                title: '持仓风险评估',
                desc: lines.join('') + '<div style="margin-top:.6rem;color:#6b7fa3;font-size:.72rem;">风险等级会随市场波动而调整</div>'
              });
            }
          });
        }
        optionList.appendChild(a);
      });
    }

    render();
    document.addEventListener('visibilitychange', function () { if (!document.hidden) render(); });
  })();
</script>
</body>
</html>
